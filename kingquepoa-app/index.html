/* ---------------- ajustes ---------------- */
function pintarAjustes(app){
  app.innerHTML = `
    <div class="card">
      <h3>Clave de Google</h3>
      <p class="hint" style="margin-bottom:10px">Se pega una sola vez en este teléfono. Sirve para ver los saldos, anotar abonos y vender.</p>
      <label class="f"><span>Clave (token)</span><input id="a-token" type="password" placeholder="Pegala acá" autocomplete="new-password"></label>
      <div style="display:grid;gap:8px">
        <button class="btn" id="a-guardar">Guardar clave</button>
        <button class="btn ghost" id="a-probar">🔌 Probar conexión</button>
      </div>
    </div>

    <div class="card">
      <h3>Datos</h3>
      <p class="hint" id="a-datos"></p>
      <div style="display:grid;gap:8px;margin-top:10px">
        <button class="btn ghost" id="a-actualizar">⟳ Actualizar inventario</button>
        <button class="btn ghost" id="a-instarar" ${instalarEvento?'':'hidden'}>📲 Instalar en el teléfono</button>
        <p class="hint" id="a-instalar-tip" style="margin-top:2px"></p>
        <button class="btn rojo" id="a-limpiar">Borrar datos guardados</button>
      </div>
    </div>

    <div class="card">
      <h3>Vender y cobrar</h3>
      <label class="f"><span style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px"><input type="checkbox" id="a-abonos" style="width:auto"> Permitir abonos desde el teléfono</span></label>
      <p class="hint">Si lo apagás, en Cobros solo se pueden mandar recordatorios.</p>
    </div>

    <div class="card">
      <h3>Pedir un perfume</h3>
      <p class="hint" style="margin-bottom:10px">Llega a la PC como pedido. Ahí lo revisás y lo cargás al inventario.</p>
      <label class="f"><span>Perfume</span><input id="p-nombre" placeholder="Ej: Eros Flame" autocomplete="off"></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <label class="f"><span>Marca</span><input id="p-marca" placeholder="Versace" autocomplete="off"></label>
        <label class="f"><span>ml</span><input id="p-ml" type="number" min="1" inputmode="numeric"></label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <label class="f"><span>Género</span><select id="p-cat">
          <option value="">Elegí...</option><option>Hombre</option><option>Mujer</option><option>Unisex</option>
        </select></label>
        <label class="f"><span>Concentración</span><select id="p-conc">
          <option value="">Elegí...</option><option>EDT</option><option>EDP</option><option>Parfum</option>
          <option>Elixir</option><option>Extrait</option><option value="__no__">No aplica</option>
        </select></label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <label class="f"><span>Costo USD</span><input id="p-usd" type="number" step="0.01" inputmode="decimal"></label>
        <label class="f"><span>Cantidad</span><input id="p-cant" type="number" min="1" value="1" inputmode="numeric"></label>
      </div>
      <button class="btn" id="p-enviar">Enviar pedido a la PC</button>
    </div>

    <div class="card">
      <h3>Cómo funciona</h3>
      <p class="hint">
        Esta app <b>muestra el catálogo</b> y, con la clave, <b>registra ventas</b>. Las ventas entran solas al sistema en menos de un minuto (si la PC está encendida).<br><br>
        La PC publica sola los cambios, y esta app los ve al abrir o al tocar ⟳.<br><br>
        Sin clave, la app es solo para mirar: no muestra cobros, ventas ni ajustes.
      </p>
    </div>

    <p class="hint" style="text-align:center;padding:8px 0 4px">Versión ${VERSION}</p>`;

  $('#a-token').value = token();
  const esIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const tip = $('#a-instalar-tip');
  if(tip){
    tip.textContent = instalarEvento
      ? 'Tocá el botón y confirmá. Queda como una app más.'
      : (esIOS
          ? 'En iPhone: tocá Compartir (⬆️) abajo y elegí "Agregar a pantalla de inicio".'
          : 'En Chrome: menú ⋮ (arriba a la derecha) → "Instalar aplicación" o "Agregar a pantalla principal".');
  }
  $('#a-datos').textContent = datos.guardado
    ? (datos.inventario.length + ' perfumes · actualizado ' + hace(datos.guardado))
    : 'Sin datos guardados todavía.';

  const chkAbonos = $('#a-abonos');
  if(chkAbonos){
    chkAbonos.checked = abonosOn();
    chkAbonos.onchange = e => {
      guardarAbonosOn(e.target.checked);
      toast(e.target.checked ? '✅ Abonos desde el teléfono activados' : 'Abonos desde el teléfono desactivados');
    };
  }

  $('#p-enviar').onclick = async () => {
    const t = token();
    if(!t) return toast('Falta la clave en Acceso', 'error');
    const nombre = $('#p-nombre').value.trim();
    if(!nombre) return toast('Escribí el nombre del perfume', 'error');
    const pd = {
      marca: $('#p-marca').value.trim(),
      categoria: $('#p-cat').value,
      concentracion: $('#p-conc').value === '__no__' ? '' : $('#p-conc').value,
      ml: Math.round(num($('#p-ml').value)) || 0,
      costo_usd: num($('#p-usd').value) || 0,
      cantidad: Math.max(1, Math.round(num($('#p-cant').value) || 1))
    };
    const marca = '[[KQV:' + JSON.stringify(Object.assign({ pedido: true }, pd)) + ']]';
    const btn = $('#p-enviar');
    btn.disabled = true; btn.textContent = 'Enviando…';
    try {
      const r = await fetch(API, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action:'movimiento', token:t, tipo:'pedido',
          perfume: nombre, cantidad: pd.cantidad,
          nota: 'Pedido desde el celular ' + marca,
          dispositivo:'app-celular'
        })
      });
      const j = await r.json();
      if(!j || !j.ok) throw new Error((j && j.error) || 'Google rechazó el pedido');
      toast('📦 Pedido enviado: revisalo en la PC');
      ['p-nombre','p-marca','p-ml','p-usd'].forEach(id => $('#'+id).value = '');
      $('#p-cat').value = ''; $('#p-conc').value = ''; $('#p-cant').value = 1;
    } catch(e){
      toast(e.message || 'No se pudo enviar', 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Enviar pedido a la PC';
    }
  };

  $('#a-guardar').onclick = () => {
    const t = $('#a-token').value.trim();
    guardarToken(t);
    if(!t){
      // Al borrar la clave, no dejamos costos privados guardados en el teléfono.
      try { localStorage.removeItem(LS.costos); } catch(e){}
      costos = null;
    }
    aplicarRol();
    toast(t ? 'Clave guardada' : 'Clave borrada');
    render();
    if(t){ cargarCobros(false); cargarCostos(false); }
  };

  $('#a-probar').onclick = async () => {
    const t = $('#a-token').value.trim();
    if(!t) return toast('Pegá la clave primero', 'error');
    guardarToken(t);
    aplicarRol();
    render();
    toast('Probando…');
    try {
      const r = await fetch(API + '?action=movimientos&token=' + encodeURIComponent(t) + '&limite=1&t=' + Date.now());
      const j = await r.json();
      if(j && j.ok) toast('✅ Conexión correcta');
      else toast((j && j.error) || 'La clave no funciona', 'error');
    } catch(e){ toast('Sin conexión', 'error'); }
  };

  $('#a-actualizar').onclick = () => sincronizar(false);

  $('#a-instarar').onclick = async () => {
    if(!instalarEvento) return;
    instalarEvento.prompt();
    await instalarEvento.userChoice;
    instalarEvento = null;
    render();
  };

  $('#a-limpiar').onclick = () => {
    if(!confirm('Borra el catálogo y los registros guardados en este teléfono. No borra nada en Google.')) return;
    try {
      localStorage.removeItem(LS.datos);
      localStorage.removeItem(LS.notas);
      localStorage.removeItem(LS.cobros);
      localStorage.removeItem(LS.abonosPend);
      localStorage.removeItem(LS.numeros);
      localStorage.removeItem(LS.costos);
      localStorage.removeItem(LS.porComprar);
    } catch(e){}
    datos = { inventario:[], config:{}, guardado:null };
    notas = [];
    cobros = [];
    nums = null;
    costos = null;
    porComprar = [];
    toast('Datos borrados');
    sincronizar(false);
    render();
  };
}

/* ---------------- navegación ---------------- */
document.querySelectorAll('nav button').forEach(b => {
  b.addEventListener('click', () => {
    vista = b.dataset.v;
    try { history.replaceState(null, '', '#' + vista); } catch(e){}
    render();
    if(vista === 'stock' && token()) refrescarEstadoVentas();
    if(vista === 'cobros'){ refrescarEstadoVentas(); cargarCobros(false); }
    if(vista === 'numeros'){ refrescarEstadoVentas(); cargarNumeros(false); }
    window.scrollTo(0,0);
  });
});
$('#btn-sync').addEventListener('click', () => {
  sincronizar(false);
  if(token()){
    refrescarEstadoVentas();
    cargarCostos(false);
    if(vista === 'cobros') cargarCobros(false);
    if(vista === 'numeros') cargarNumeros(false);
  }
});

window.addEventListener('online', () => { pintarEstado(); });
window.addEventListener('offline', () => pintarEstado(true));
window.addEventListener('hashchange', () => {
  const h = location.hash.replace('#','');
  if(['stock','vender','cobros','numeros','cotizar','catalogo','ajustes'].includes(h) && h !== vista){
    vista = h;
    render();
    if(h === 'stock' && token()) refrescarEstadoVentas();
    if(h === 'cobros'){ refrescarEstadoVentas(); cargarCobros(false); }
    if(h === 'numeros'){ refrescarEstadoVentas(); cargarNumeros(false); }
    window.scrollTo(0,0);
  }
});
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  instalarEvento = e;
  if(vista === 'ajustes') render();
});

document.addEventListener('click', ev => {
  const box = document.querySelector('#v-prod-sug');
  if(box && !box.contains(ev.target) && ev.target.id !== 'v-prod-buscar') box.classList.add('oculto');
});

/* ---------------- arranque ---------------- */
(function init(){
  const guardado = leerLS(LS.datos, null);
  if(guardado && Array.isArray(guardado.inventario)){
    datos = guardado;
  }
  notas = leerLS(LS.notas, []);
  if(!Array.isArray(notas)) notas = [];

  const gc = leerLS(LS.cobros, null);
  if(gc && Array.isArray(gc.cobros)) cobros = gc.cobros;

  abonosPendientes = leerLS(LS.abonosPend, []);
  if(!Array.isArray(abonosPendientes)) abonosPendientes = [];

  const gn = leerLS(LS.numeros, null);
  if(gn && gn.nums) nums = gn.nums;

  const gco = leerLS(LS.costos, null);
  if(gco && Array.isArray(gco.costos)) costos = gco;

  porComprar = leerLS(LS.porComprar, []);
  if(!Array.isArray(porComprar)) porComprar = [];

  // Permite cargar la clave una sola vez desde un enlace:  ...?clave=XXXX
  try {
    const params = new URLSearchParams(location.search);
    const claveUrl = params.get('clave');
    if(claveUrl && claveUrl.trim()){
      guardarToken(claveUrl.trim());
      params.delete('clave');
      const q = params.toString();
      history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash);
      setTimeout(() => toast('Clave guardada en este teléfono'), 600);
    }
  } catch(e){}

  const h = location.hash.replace('#','');
  if(['stock','vender','cobros','numeros','cotizar','catalogo','ajustes'].includes(h)) vista = h;

  render();
  pintarEstado(!navigator.onLine);

  sincronizar(true).then(() => {
    if(token()) refrescarEstadoVentas();
    if(token()) cargarCobros(false);
    if(token()) cargarCostos(false);
    if(token() && vista === 'numeros') cargarNumeros(false);
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
})();
</script>
