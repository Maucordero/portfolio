<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="description" content="King Quepoa · inventario y mensajes de la perfumería">
<title>King Quepoa</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="King Quepoa">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0e1014;--panel:#151820;--panel2:#1b1f28;--panel3:#232936;
    --line:#262b36;--line2:#333a49;--text:#e8eaf0;--muted:#98a0af;
    --gold:#c9a24b;--gold2:#e6c87e;--green:#3ecf8e;--red:#f0575d;--blue:#5aa9ff;
    --r:14px;--r-sm:10px;
  }
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg);color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:calc(110px + env(safe-area-inset-bottom));
    overscroll-behavior-y:contain;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  h1,h2,h3,p{margin:0}
  .oculto{display:none !important}

  header{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:11px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:rgba(14,16,20,.93);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  header img{width:36px;height:36px;border-radius:10px;flex:none}
  header .t{flex:1;min-width:0}
  header b{display:block;font-size:15px;letter-spacing:.2px}
  header small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header small b{display:inline;font-weight:600;color:var(--green)}
  .icono{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    width:40px;height:40px;border-radius:11px;font-size:18px;line-height:1;
  }
  .icono:active{background:var(--panel3)}

  main{padding:14px 14px 22px}
  .titulo{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}

  .buscador{position:relative;margin-bottom:10px}
  .buscador input{
    width:100%;padding:12px 14px 12px 40px;border-radius:var(--r);
    background:var(--panel);border:1px solid var(--line);outline:none;
  }
  .buscador input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.15)}
  .buscador span{position:absolute;left:13px;top:11px;color:var(--muted);font-size:16px}

  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    white-space:nowrap;padding:8px 13px;border-radius:999px;font-size:13px;
    background:var(--panel);border:1px solid var(--line);color:var(--muted)
  }
  .chip.on{background:rgba(201,162,75,.14);border-color:rgba(201,162,75,.5);color:var(--gold2)}

  .prod{
    display:flex;gap:12px;align-items:flex-start;padding:12px;margin-bottom:10px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  }
  .prod:active{background:var(--panel2)}
  .foto{
    width:54px;height:54px;border-radius:12px;flex:none;overflow:hidden;
    background:var(--panel2);display:grid;place-items:center;font-size:22px
  }
  .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .foto img.logo-fallback{object-fit:contain;padding:10px;opacity:.55}
  .prod .info{flex:1;min-width:0}
  /* Miniatura grande: la foto ocupa todo el alto del lado izquierdo */
  .prod-foto{padding:0;align-items:stretch;overflow:hidden;min-height:112px}
  .prod-foto .foto{width:112px;height:auto;align-self:stretch;border-radius:0;flex:0 0 112px}
  .prod-foto .foto img{height:100%;border-radius:0}
  .prod-foto .info{padding:12px 12px 12px 10px;display:flex;flex-direction:column;justify-content:center}
  .prod .nom{font-weight:600;font-size:14.5px;line-height:1.3;margin-bottom:2px}
  .prod .mar{font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .precio{color:var(--gold2);font-weight:700;font-size:14.5px}
  .pagos{font-size:12px;color:var(--muted)}
  .abono{font-size:12px;color:var(--gold2)}
  .stock{
    font-size:11px;padding:3px 8px;border-radius:999px;
    background:rgba(62,207,142,.12);border:1px solid rgba(62,207,142,.35);color:var(--green)
  }
  .stock.cero{background:rgba(240,87,93,.1);border-color:rgba(240,87,93,.35);color:var(--red)}
  .tag{
    font-size:11px;padding:3px 8px;border-radius:999px;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted)
  }
  .ct-grupo{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel2);overflow:hidden}
  .ct-grupo>summary{list-style:none;cursor:pointer;padding:10px 12px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:space-between}
  .ct-grupo>summary::-webkit-details-marker{display:none}
  .ct-grupo[open]>summary{border-bottom:1px solid var(--line);background:var(--panel3)}
  .ct-grupo .ct-sub{padding:4px 12px 8px}
  .ct-dist{border-top:1px solid var(--line);padding:6px 0}
  .ct-dist:first-child{border-top:0}
  .ct-dist>summary{list-style:none;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px;padding:4px 0}
  .ct-dist>summary::-webkit-details-marker{display:none}
  .ct-det{font-size:12px;color:var(--muted);padding:6px 0 2px;line-height:1.6}
  .ct-det b{color:var(--text)}

  .vacio{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
  .vacio .em{font-size:34px;display:block;margin-bottom:8px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;overflow:hidden}
  .card h3{font-size:14px;margin-bottom:4px}
  .hint{font-size:12.5px;color:var(--muted)}

  label.f{display:block;margin-bottom:12px}
  label.f > span{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  input,select,textarea{
    width:100%;padding:12px;border-radius:var(--r-sm);
    background:var(--panel2);border:1px solid var(--line);outline:none;
    min-width:0;max-width:100%
  }
  input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.14)}
  textarea{resize:vertical;min-height:76px}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--panel2);padding:5px;border-radius:12px;border:1px solid var(--line);margin-bottom:14px}
  .seg button{background:none;border:0;color:var(--muted);padding:10px 4px;border-radius:9px;font-size:13.5px}
  .seg button.on{background:rgba(201,162,75,.15);color:var(--gold2);font-weight:600}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 16px;border-radius:12px;border:0;font-weight:600;font-size:14.5px;
    background:var(--gold);color:#171307;width:100%
  }
  .btn:active{filter:brightness(.95)}
  .btn:disabled{opacity:.55}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .btn.verde{background:var(--green);color:#06281b}
  .btn.rojo{background:transparent;border:1px solid rgba(240,87,93,.5);color:var(--red)}
  .btn.sm{padding:9px 12px;font-size:13px;width:auto}

  .lista-mini{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .mini{
    display:flex;gap:10px;align-items:flex-start;padding:10px 12px;
    background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm)
  }
  .mini .c{flex:1;min-width:0}
  .mini .c b{display:block;font-size:13.5px}
  .mini .c small{color:var(--muted);font-size:11.5px}
  .estado-mini{font-size:11px;white-space:nowrap}
  .estado-mini.ok{color:var(--green)}
  .estado-mini.pend{color:var(--gold)}

  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
    gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    background:rgba(21,24,32,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line)
  }
  nav button{
    background:none;border:0;color:var(--muted);font-size:10.5px;min-width:0;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:11px
  }
  nav button i{font-style:normal;font-size:20px;line-height:1}
  nav button.activo{color:var(--gold);background:rgba(201,162,75,.09)}

  .hoja-fondo{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);display:flex;align-items:flex-end}
  .hoja{
    width:100%;max-height:90vh;overflow:auto;background:var(--panel);
    border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
    padding:8px 16px calc(20px + env(safe-area-inset-bottom))
  }
  .hoja .agarre{width:44px;height:4px;border-radius:2px;background:var(--line2);margin:6px auto 14px}
  .hoja h2{font-size:17px;line-height:1.25;margin-bottom:3px}
  .hoja .sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .hoja .cuerpo{font-size:13.5px;color:#d7dbe5;white-space:pre-wrap;line-height:1.5;margin:12px 0}  .hoja .precios{display:flex;gap:10px;margin:12px 0}
  .foto-grande{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0 12px;text-align:center}
  .foto-grande img{max-width:100%;max-height:280px;border-radius:8px;display:block;margin:0 auto}
  .hoja .precios div{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
  .hoja .precios small{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
  .hoja .precios b{font-size:15px;color:var(--gold2)}
  .hoja .precios div.p b{color:var(--green)}
  .hoja .acciones{display:grid;gap:8px;margin-top:14px}

  .toast{
    position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
    background:#232936;border:1px solid var(--line2);color:var(--text);
    padding:11px 16px;border-radius:12px;font-size:13.5px;z-index:60;
    opacity:0;pointer-events:none;transition:.18s;max-width:88vw;text-align:center
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.error{border-color:rgba(240,87,93,.6);color:#ffd7d9}
  .oculto{display:none!important}

  pre.catalogo{
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:13px;font:12.5px/1.55 ui-monospace,Consolas,monospace;
    white-space:pre-wrap;word-break:break-word;margin:10px 0
  }
  .punto{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--green);margin-right:5px}
  .punto.off{background:var(--red)}
  .aviso{
    font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:12px;
    background:rgba(201,162,75,.1);border:1px solid rgba(201,162,75,.35);color:var(--gold2)
  }
  .aviso.ok{
    background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.35);color:var(--green)
  }
  .sugerencias-app{
    position:absolute;left:0;right:0;top:100%;z-index:40;margin-top:4px;
    background:var(--panel2);border:1px solid var(--line2);border-radius:10px;
    box-shadow:0 12px 30px rgba(0,0,0,.45);max-height:300px;overflow:auto
  }
  .sugerencias-app .sug{
    display:flex;gap:10px;justify-content:space-between;align-items:center;
    padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer
  }
  .sugerencias-app .sug:last-child{border-bottom:0}
  .sugerencias-app .sug .nom{font-size:13px;font-weight:600;line-height:1.25}
  .sugerencias-app .sug .mar{font-size:11px;color:var(--muted);margin-top:2px}
  .sugerencias-app .sug .st{font-size:11px;font-weight:700;white-space:nowrap}
  .st.ok{color:var(--green)}
  .st.no{color:var(--red)}
</style>
</head>
<body>

<header>
  <img src="./icons/icon-192-v2.png" alt="">
  <div class="t">
    <b>King Quepoa</b>
    <small id="estado"><span class="punto"></span>cargando…</small>
  </div>
  <button class="icono" id="btn-sync" title="Actualizar">⟳</button>
</header>

<main id="app"></main>

<nav>
  <button data-v="stock" class="activo"><i>🧴</i><span>Stock</span></button>
  <button data-v="vender" class="oculto"><i>🛒</i><span>Vender</span></button>
  <button data-v="cobros" class="oculto"><i>💰</i><span>Cobros</span></button>
  <button data-v="numeros" class="oculto"><i>📊</i><span>Números</span></button>
  <button data-v="cotizar" class="oculto"><i>🧮</i><span>Cotizar</span></button>
  <button data-v="ajustes" class="oculto"><i>⚙️</i><span>Ajustes</span></button>
</nav>

<div id="hoja-wrap"></div>
<div class="toast" id="toast"></div>

<script src="factura.js"></script>
<script>
/* ============================================================
   King Quepoa · app del celular
   Lee el catálogo de Google (público) y manda movimientos con
   la clave privada que se pega una sola vez en Ajustes.
   ============================================================ */

const API = 'https://script.google.com/macros/s/AKfycbxwgQj5KlOZh7evelU9FsjJdLVZZSYh8hn5N51lSsLD13vmoajNJJg09u93h5OKopev/exec';
const VERSION = '1.18.0';
const FOTOS = './fotos/';
const FOTOS_GRANDES = './fotos_grandes/';
const LS = { datos:'kq_datos_v1', token:'kq_token_v1', notas:'kq_notas_v1', cobros:'kq_cobros_v1', ventas:'kq_ventas_v1', abonos:'kq_abonos_v1', abonosPend:'kq_abonos_pend_v1', numeros:'kq_numeros_v1', costos:'kq_costos_v1', porComprar:'kq_por_comprar_v1' };

let datos = { inventario:[], config:{}, guardado:null };
let cobros = [];
let cobrosFiltro = 'porcobrar';
let abonosPendientes = [];
let nums = null, numsError = '', numsFiltro = 'todas', cargandoNums = false;
let costos = null, costosError = '', cargandoCostos = false;
let cotizacionesTmp = [];
let porComprar = [];
let vista = 'stock';
let filtro = { q:'', cat:'Todos', soloStock:false };
let notas = [];
let instalarEvento = null;

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
function money(n){
  const v = Math.round(num(n));
  return '₡' + v.toLocaleString('de-DE');
}
function usd(n){
  const v = num(n);
  return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function norm(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
function mil(n){ return Math.round(num(n)/1000)*1000; }

// Prima en colones. El porcentaje es interno: el celular recibe solo montos.
let _primasCache = { raw: null, mapa: {} };
function primasMapa(){
  const raw = String((datos.config || {}).prima_json || '');
  if(raw !== _primasCache.raw){
    let mapa = {};
    try { mapa = JSON.parse(raw) || {}; } catch(e){ mapa = {}; }
    _primasCache = { raw: raw, mapa: mapa };
  }
  return _primasCache.mapa;
}
function primaDe(p){
  const directo = num(p && p.prima_crc);
  if(directo > 0) return directo;
  const m = primasMapa()[p && p.id];
  if(m != null) return num(m);
  // Compatibilidad con catálogos viejos que todavía traen el porcentaje.
  const pct = num((datos.config || {}).prima_sugerida);
  return pct > 0 ? mil(num(p.precio_crc) * pct / 100) : 0;
}

// Costos de compra (privados: solo llegan con la clave).
let _costosCache = { raw: null, mapa: {} };
function costosMapa(){
  const raw = costos && costos.costos;
  if(raw !== _costosCache.raw){
    const mapa = {};
    (raw || []).forEach(c => { mapa[String(c.id)] = c; });
    _costosCache = { raw: raw, mapa: mapa };
  }
  return _costosCache.mapa;
}
function costoDe(p){
  if(!token()) return null;
  return (p && costosMapa()[String(p.id)]) || null;
}
function margenDe(p, costo){
  const precio = num(p && p.precio_crc);
  const costoCrc = num(costo && costo.costo_crc);
  const ganancia = precio - costoCrc;
  const margen = precio > 0 ? (ganancia / precio) * 100 : 0;
  return { ganancia: ganancia, margen: margen };
}

// Sin token = visitante: solo catálogo y precios.
function esDueno(){ return !!token(); }

function fotoUrl(p){
  const f = String((p && p.foto) || '');
  if(!f) return '';
  if(/^https?:\/\//i.test(f)) return f;
  return FOTOS + f.split('/').map(encodeURIComponent).join('/');
}

// Versión GRANDE de la foto (para la imagen que se manda por WhatsApp).
function fotoGrandeUrl(p){
  const f = String((p && p.foto) || '');
  if(!f) return '';
  if(/^https?:\/\//i.test(f)) return f;
  return FOTOS_GRANDES + f.split('/').map(encodeURIComponent).join('/');
}

function emojiFamilia(f){  const s = norm(f);
  if(/citric|hesperid|limon|naranja/.test(s)) return '🍋';
  if(/frut/.test(s)) return '🍓';
  if(/floral/.test(s)) return '🌸';
  if(/dulce|gourmand|vainilla|caramelo/.test(s)) return '🍯';
  if(/ambar|oriental/.test(s)) return '🔥';
  if(/especiad/.test(s)) return '🌶️';
  if(/amaderad|madera|woods/.test(s)) return '🪵';
  if(/acuatic|marin/.test(s)) return '💧';
  if(/aromatic|fouger/.test(s)) return '🌿';
  if(/cuero|leather/.test(s)) return '🧥';
  return '🧴';
}
function genero(cat){
  const c = String(cat||'');
  if(c === 'Hombre') return '👨 Fragancia de hombre';
  if(c === 'Mujer')  return '👩 Fragancia de mujer';
  if(c === 'Unisex') return '⚥ Perfume unisex';
  return '';
}
function hace(ts){
  if(!ts) return 'sin datos';
  const d = new Date(ts);
  if(isNaN(d)) return 'sin datos';
  const min = Math.floor((Date.now() - d.getTime())/60000);
  if(min < 1) return 'recién';
  if(min < 60) return 'hace ' + min + ' min';
  const h = Math.floor(min/60);
  if(h < 24) return 'hace ' + h + ' h';
  return 'hace ' + Math.floor(h/24) + ' d';
}
function toast(msg, tipo){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast on' + (tipo === 'error' ? ' error' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.className = 'toast' + (tipo === 'error' ? ' error' : ''); }, 2600);
}

/* ---------------- almacenamiento ---------------- */
function leerLS(k, def){
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }
  catch(e){ return def; }
}
function guardarLS(k, v){
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){}
}

function token(){
  try { return localStorage.getItem(LS.token) || ''; } catch(e){ return ''; }
}
function guardarToken(t){
  try { t ? localStorage.setItem(LS.token, t) : localStorage.removeItem(LS.token); } catch(e){}
}
function abonosOn(){
  try { return (localStorage.getItem(LS.abonos) || '1') !== '0'; } catch(e){ return true; }
}
function guardarAbonosOn(v){
  try { localStorage.setItem(LS.abonos, v ? '1' : '0'); } catch(e){}
}

/* ---------------- roles: dueño vs visitante ---------------- */
function aplicarRol(){
  const dueno = esDueno();
  const privadas = ['vender','cobros','numeros','cotizar','ajustes'];
  let visibles = 0;
  document.querySelectorAll('nav button').forEach(b => {
    const ocultar = !dueno && privadas.indexOf(b.dataset.v) !== -1;
    b.classList.toggle('oculto', ocultar);
    if(!ocultar) visibles++;
  });

}

async function copiar(txt, msg){

      await navigator.clipboard.writeText(txt);
      toast(msg || 'Copiado');

    }

/* ---------------- vender desde el teléfono (solo dueño) ---------------- */
function isoFecha(y, m, d){
  const x = new Date(y, m, d, 12, 0, 0);
  return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0');
}
function proximaCuotaISO(){
  const d = new Date();
  const y = d.getFullYear(), m = d.getMonth(), dia = d.getDate();
  return dia < 16 ? isoFecha(y, m, 16) : isoFecha(y, m + 1, 1);
}
function planDe(tipo){
  return ({ pagos:2, pagos_sin_recargo:2, un_pago_abono:1, pagos3:3, pagos4:4, pagos5:5 })[tipo] || 0;
}
function repartirMonto(total, n){
  const t = Math.max(0, Math.round(num(total)));
  if(n <= 0) return [];
  const base = Math.floor(t / n);
  return Array.from({ length: n }, (_, i) => i === n - 1 ? t - base * (n - 1) : base);
}
function etiquetaPagoCel(n){
  return ["Primer pago","Segundo pago","Tercer pago","Cuarto pago","Quinto pago","Sexto pago"][n - 1] || ("Pago " + n);
}
function recargoDe(tipo){
  const n = planDe(tipo);
  if(!n || tipo === 'pagos_sin_recargo' || tipo === 'un_pago_abono') return 0;
  const c = datos.config || {};
  const v = num(c['recargo_p' + n]);
  if(v > 0) return v;
  return n === 2 ? num(c.recargo_pagos) : 0;
}
function totalVenta(p, cant, tipo){
  return mil(num(p.precio_crc) * cant * (1 + recargoDe(tipo) / 100));
}
function ventasLocales(){
  const v = leerLS(LS.ventas, []);
  return Array.isArray(v) ? v : [];
}
function guardarVentasLocales(v){ guardarLS(LS.ventas, v.slice(0, 40)); }

// Stock que ve el dueño en el teléfono: descuenta las ventas locales todavía pendientes de la PC.
function stockLocalDe(p){
  if(!p) return 0;
  let n = Number(p.stock) || 0;
  for(const v of ventasLocales()){
    if(v.estado === 'confirmada') continue;
    const items = Array.isArray(v.items) && v.items.length
      ? v.items
      : [{ producto_id: v.perfume_id, nombre: v.perfume, cantidad: v.cantidad }];
    for(const it of items){
      const mismo = (it.producto_id != null && String(it.producto_id) === String(p.id)) ||
        (it.producto_id == null && norm(it.nombre || v.perfume) === norm(p.nombre));
      if(mismo) n -= (num(it.cantidad) || 1);
    }
  }
  return Math.max(0, n);
}

/* ---- Plan de una venta hecha en el teléfono (factura y cobros sin esperar la PC) ---- */
function normalizarVentaLocal(v){
  if(!v) return v;
  if(v.abono == null && v.prima != null) v.abono = num(v.prima);
  if(!v.cantidad) v.cantidad = 1;
  if(!v.fecha_venta){
    const d = new Date(v.ts || Date.now());
    v.fecha_venta = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  if(!v.perfume_id){
    const p = datos.inventario.find(x => norm(x.nombre) === norm(v.perfume));
    if(p){ v.perfume_id = p.id; v.foto = v.foto || p.foto || ''; }
  }
  if(v.telefono == null) v.telefono = '';
  if(v.referencia == null) v.referencia = '';
  if(v.foto == null) v.foto = '';
  return v;
}

function planLocal(v){
  v = normalizarVentaLocal(v);
  const total = Math.max(0, num(v && (v.monto != null ? v.monto : v.total)));
  const tipo = String((v && (v.tipo || v.tipo_pago)) || 'contado');
  const planN = planDe(tipo);
  const abono = Math.min(Math.max(0, num(v && v.abono)), total);
  const fecha = String((v && (v.fecha || v.primera_cuota)) || proximaCuotaISO()).slice(0, 10);
  let cuotas = [];
  let abonado = abono;
  let saldo = Math.max(total - abono, 0);

  if(planN > 0){
    const nuevoModelo = v.abono_pagado !== undefined && v.abono_pagado !== null;
    if(nuevoModelo){
      const abonoPagado = !!v.abono_pagado;
      const primeraPago = abonoPagado ? fecha : (cuotasProg(fecha, 2)[1] || fecha);
      const fechas = cuotasProg(primeraPago, planN);
      const partes = repartirMonto(Math.max(0, total - abono), planN);
      const pagos = fechas.map((f, i) => ({ numero: i + 1, monto: partes[i], vencimiento: f, pagada: false, tipo: 'abono' }));
      if(abono > 0){
        cuotas = [
          { numero: 0, monto: abono, monto_total: abono, vencimiento: abonoPagado ? String(v.fecha_venta || fecha).slice(0, 10) : fecha, pagada: abonoPagado, tipo: 'abono', etiqueta: 'Abono' },
          ...pagos,
        ];
        abonado = abonoPagado ? abono : 0;
        saldo = abonoPagado ? Math.max(total - abono, 0) : total;
      } else {
        cuotas = pagos;
        abonado = 0;
        saldo = total;
      }
    } else if(planN >= 2 && v.modo === 'primer_pago' && abono > 0){
      // Compatibilidad con ventas locales viejas
      const n = planN - 1;
      const partes = repartirMonto(Math.max(total - abono, 0), n);
      const fechas = cuotasProg(fecha, n);
      cuotas = [
        { numero: 1, monto: abono, vencimiento: String(v.fecha_venta || fecha).slice(0, 10), pagada: true, tipo: 'abono', etiqueta: 'Abono' },
        ...fechas.map((f, i) => ({ numero: i + 2, monto: partes[i], vencimiento: f, pagada: false, tipo: 'abono' })),
      ];
      abonado = abono;
      saldo = Math.max(total - abono, 0);
    } else {
      // Compatibilidad con ventas locales viejas (abono inicial)
      const partes = repartirMonto(Math.max(total - abono, 0), planN);
      const fechas = cuotasProg(fecha, planN);
      cuotas = fechas.map((f, i) => ({ numero: i + 1, monto: partes[i], vencimiento: f, pagada: false, tipo: 'abono' }));
      abonado = abono;
      saldo = Math.max(total - abono, 0);
    }
  } else {
    abonado = total;
    saldo = 0;
  }

  const pend = cuotas.filter(c => !c.pagada && c.monto > 0.5);
  const prox = pend[0] || null;
  const atrasado = pend.some(c => c.vencimiento <= hoyISO()) ? 1 : 0;
  return {
    total, abonado, saldo, cuotas,
    proximo: prox ? prox.vencimiento : '',
    proximo_monto: prox ? Math.round(prox.monto) : 0,
    pendientes: pend.length,
    atrasado,
    completo: true,
  };
}

/* ---------- Factura / proforma / aviso con el mismo diseño de la PC ---------- */
function datosFacturaCel(v){
  v = normalizarVentaLocal(v);
  const total = Math.max(0, num(v.total != null ? v.total : v.monto));
  const tipo = String(v.tipo_pago || v.tipo || 'contado');
  const planN = planDe(tipo);
  let crudas = [];
  if(Array.isArray(v.cuotas)) crudas = v.cuotas;
  else if(typeof v.cuotas === 'string' && v.cuotas.trim()){
    try { const j = JSON.parse(v.cuotas); if(Array.isArray(j)) crudas = j; } catch(e){}
  }
  if(!crudas.length && planN > 0){
    const plan = planLocal(v);
    crudas = plan.cuotas || [];
  }
  const normal = crudas.map(c => ({
    monto: num(c.monto != null ? c.monto : c.m),
    monto_total: num(c.monto_total != null ? c.monto_total : (c.mt != null ? c.mt : (c.monto != null ? c.monto : c.m))),
    vencimiento: String(c.vencimiento || c.f || '').slice(0, 10),
    pagada: !!(c.pagada != null ? c.pagada : c.p),
    tipo: String(c.tipo || c.t || 'abono'),
  })).filter(c => c.monto > 0.5);
  const extra = planN > 0 && normal.length > planN;
  const primerPagoModo = String(v.modo || '') === 'primer_pago';
  const abonoComoCuota = extra || primerPagoModo;
  let saldo = v.saldo != null ? num(v.saldo) : Math.max(total - normal.filter(c => c.pagada).reduce((s, c) => s + c.monto, 0), 0);
  if(v.saldo == null && planN > 0) saldo = planLocal(v).saldo;
  const pagada = saldo <= 0.5;
  const filas = normal.map((c, i) => {
    const esAbono = abonoComoCuota && i === 0;
    const etiqueta = esAbono ? (c.tipo === 'prima' ? 'Prima' : 'Abono') : (c.tipo === 'prima' ? 'Prima' : etiquetaPagoCel(i + (abonoComoCuota ? 0 : 1)));
    const p = c.pagada || pagada;
    return {
      etiqueta,
      vencimiento: c.vencimiento,
      monto: Math.round(p ? (c.monto_total || c.monto) : c.monto),
      pagada: p,
      tipo: esAbono ? 'abono' : (c.tipo === 'prima' ? 'prima' : 'pago'),
    };
  });
  const abonoFila = filas.find(c => /^(Abono|Prima)/i.test(c.etiqueta)) || null;
  const pagos = filas.filter(c => !/^(Abono|Prima)/i.test(c.etiqueta));
  const pagosN = pagos.length;
  const prox = filas.find(c => !c.pagada) || null;
  const terminos = planN === 0 ? 'Contado' : (abonoFila ? `${abonoFila.etiqueta} + ${pagosN} pago${pagosN === 1 ? '' : 's'}` : `${pagosN} pago${pagosN === 1 ? '' : 's'}`);
  return {
    total, saldo, pagada, filas, abonoFila, pagos, pagosN, planN, prox, terminos,
    vencimiento: prox ? prox.vencimiento : String(v.fecha_venta || '').slice(0, 10),
  };
}

function porPerfumesCel(v){
  let crudos = (v && Array.isArray(v.items) && v.items.length) ? v.items : [];
  if(!crudos.length){
    const texto = String((v && (v.perfume || v.producto || v.perfume_nombre)) || '');
    const partes = texto.split(' + ').map(s => s.trim()).filter(Boolean);
    crudos = partes.length ? partes.map(nombre => ({ nombre })) : [{ nombre: texto }];
  }
  const nombres = crudos.map(i => String((i && i.nombre) || '').trim()).filter(Boolean).map(n => `*${n}*`);
  if(!nombres.length) return '';
  if(nombres.length === 1) return `por el perfume ${nombres[0]}`;
  if(nombres.length === 2) return `por los perfumes ${nombres[0]} y ${nombres[1]}`;
  return `por los perfumes ${nombres.slice(0, -1).join(', ')} y ${nombres[nombres.length - 1]}`;
}

function detallePagosCel(filas, n){
  if(!filas || !filas.length) return '';
  const unir = arr => arr.length <= 1 ? (arr[0] || '') : `${arr.slice(0, -1).join(', ')} y ${arr[arr.length - 1]}`;
  const montos = filas.map(c => Math.round(num(c.monto)));
  const fechas = filas.map(c => fmtFechaCorta(c.vencimiento));
  const iguales = montos.every(m => m === montos[0]);
  if(iguales) return `${n} pago${n === 1 ? '' : 's'} de ${money(montos[0])}: ${unir(fechas)}`;
  return `${n} pagos: ${unir(filas.map((c, i) => `${money(montos[i])} el ${fechas[i]}`))}`;
}

  if(info.planN === 0){
    t += `Al contado, esto es un pago único: ${money(info.total)}.`;
    return t;
  }
  if(tipo !== 'proforma' && info.pagada){
    t += `Ya está pagada (${info.terminos}): ${money(info.total)}.`;
    return t;
  }
  const pagosTxt = detallePagosCel(info.pagos, info.pagosN);

    const esPrima = info.abonoFila.etiqueta.toLowerCase() === 'prima';
    t += `Queda en ${esPrima ? 'una prima' : 'un abono'} de ${money(info.abonoFila.monto)} el ${fmtFechaCorta(info.abonoFila.vencimiento)}`;
    t += pagosTxt ? ` y ${pagosTxt}.` : '.';

    t += `Queda en ${pagosTxt}.`;

function productoDeVentaCel(v){
  const id = String(v.perfume_id || v.producto_id || '');
  let p = id ? datos.inventario.find(x => String(x.id) === id) : null;
  if(!p){
    const n = norm(v.perfume || v.producto || '');
    p = datos.inventario.find(x => norm(x.nombre) === n);
  }
  return p || null;
}

function precioContadoCel(v){
  const p = productoDeVentaCel(v);
  if(p && num(p.precio_crc) > 0) return Math.round(num(p.precio_crc));
  const tipo = String(v.tipo_pago || v.tipo || 'contado');
  const rec = recargoDe(tipo);
  const total = num(v.total != null ? v.total : v.monto);
  return rec > 0 ? Math.round(total / (1 + rec / 100)) : Math.round(total);
}

async function facturaCelDocumento(v, tipo){
  const info = datosFacturaCel(v);
  let crudos = (v.items && v.items.length) ? v.items : [];
  if(!crudos.length){
    const texto = String(v.perfume || v.producto || 'Perfume');
    const partes = texto.split(' + ').map(s => s.trim()).filter(Boolean);
    crudos = partes.length > 1
      ? partes.map(nombre => ({ nombre, cantidad: 1 }))
      : [{ producto_id: v.perfume_id || v.producto_id, nombre: texto, cantidad: v.cantidad, precio_unitario_crc: precioContadoCel(v) }];
  }
  const items = crudos.map(it => {
    const p = productoDeVentaCel({ producto_id: it.producto_id, perfume_id: it.producto_id, nombre: it.nombre });
    const precio = num(it.precio_unitario_crc || it.precio_crc) || (p ? num(p.precio_crc) : 0) || precioContadoCel({ perfume_id: it.producto_id, perfume: it.nombre });
    return {
      nombre: it.nombre || (p && p.nombre) || 'Perfume',
      cantidad: Math.max(1, num(it.cantidad) || 1),
      precio_unitario_crc: Math.round(precio),
    };
  });
  const proforma = tipo === 'proforma';
  const numBase = (v.venta_id && !String(v.venta_id).startsWith('local-')) ? v.venta_id : v.id;
  const opts = {
    proforma,
    pagada: tipo === 'recordatorio' ? false : info.pagada,
    titulo: proforma ? 'PROFORMA' : (tipo === 'recordatorio' ? 'RECORDATORIO DE PAGO' : 'FACTURA'),
    numero: numBase ? 'KQ' + String(numBase).padStart(5, '0') : undefined,
    terminos: info.terminos,
    cuotas: info.filas,
    vencimiento: info.vencimiento,
    saldo: info.saldo,
    config: datos.config || {},
    logo: './logo.png',
  };
  if(proforma){
    opts.etiquetaCabecera = info.planN > 0 ? 'A PAGOS' : 'TOTAL A PAGAR';
    opts.montoCabecera = info.total;
  } else if(tipo === 'recordatorio'){
    opts.etiquetaCabecera = 'PRÓXIMO PAGO';
    opts.montoCabecera = info.prox ? info.prox.monto : info.saldo;
  }
  const png = await facturaPagoUnicoCel({
    cliente: v.cliente || v.nombre || '',
    tel: v.telefono || v.cliente_tel || '',
    items,
    total: info.total,
    fecha: tipo === 'recordatorio' ? hoyISO() : (v.fecha_venta || hoyISO()),
    saldo: info.saldo,
  }, opts);
  return { png, texto: tipo === 'recordatorio' ? textoCobroCel(v) : textoDocumentoCel(v, tipo), info };
}

function seleccionCobroCel(c){

  };

function fechaCerca(a, b){
  const da = String(a || '').slice(0, 10), db = String(b || '').slice(0, 10);
  if(!da || !db) return true;
  const ta = new Date(da + 'T12:00:00'), tb = new Date(db + 'T12:00:00');
  if(isNaN(ta) || isNaN(tb)) return true;
  return Math.abs(ta - tb) <= 86400000 + 1;
}

function mismaVentaCobro(a, b){
  return norm(a.cliente) === norm(b.cliente) &&
    norm(a.producto) === norm(b.producto) &&
    Math.round(num(a.total)) === Math.round(num(b.total)) &&
    num(a.cantidad || 1) === num(b.cantidad || 1) &&
    fechaCerca(a.fecha_venta, b.fecha_venta);
}

function cobrosTodos(){
  const base = Array.isArray(cobros) ? cobros : [];
  const locales = ventasLocales()
    .filter(v => v.estado !== 'confirmada')
    .map(cobroLocal)
    .filter(c => c && num(c.saldo) > 0.5 && !base.some(g => mismaVentaCobro(c, g)));
  return [...locales, ...base];
}

function mismaVentaNum(a, b){
  return norm(a.cliente) === norm(b.cliente) &&
    norm(a.perfume) === norm(b.perfume) &&
    Math.round(num(a.total)) === Math.round(num(b.total)) &&
    num(a.cantidad || 1) === num(b.cantidad || 1) &&
    fechaCerca(a.fecha || a.fecha_venta, b.fecha || b.fecha_venta);
}

function ventasLocalesPendientes(){
  const base = (nums && Array.isArray(nums.ventas)) ? nums.ventas : [];
  return ventasLocales()
    .filter(v => v.estado !== 'confirmada')
    .filter(v => !base.some(g => mismaVentaNum(ventaLocalANum(v), g)));
}

function ventaLocalANum(v){

    referencia: v.referencia || '',
    perfume: v.perfume || (prod && prod.nombre) || '',
    cantidad: num(v.cantidad) || 1,
    total: plan.total,
    cobrado: plan.abonado,
    saldo: plan.saldo,
    estado: plan.saldo <= 0.5 ? 'pagada' : (plan.abonado > 0 ? 'abonando' : 'sin_pagos'),
    local: true,
    pendiente: v.estado !== 'confirmada',
    plan,
  };
}

function resumenConLocales(){
  const r = Object.assign({}, (nums && nums.resumen) || {});
  for(const v of ventasLocalesPendientes()){
    const plan = planLocal(v);
    const prod = datos.inventario.find(p => String(p.id) === String(v.perfume_id));
    const costo = costoDe({ id: v.perfume_id });
    const costoUnit = costo ? num(costo.costo_crc) : 0;
    const precio = prod ? num(prod.precio_crc) : 0;
    const qty = num(v.cantidad) || 1;
    r.total_vendido = num(r.total_vendido) + plan.total;
    r.por_cobrar = num(r.por_cobrar) + plan.saldo;
    r.n_ventas = num(r.n_ventas) + 1;
    r.unidades_vendidas = num(r.unidades_vendidas) + qty;
    if(costoUnit > 0){
      r.ganancia_cobrada = num(r.ganancia_cobrada) + Math.max(0, Math.min(plan.total, plan.abonado) - (costoUnit * qty));
      r.invertido_stock = num(r.invertido_stock) - (costoUnit * qty);
    }
    r.venta_stock = num(r.venta_stock) - (precio * qty);
    r.unidades_stock = num(r.unidades_stock) - qty;
  }
  r.ganancia_potencial = num(r.venta_stock) - num(r.invertido_stock);
  return r;
}

function categoriasConLocales(){
  const cats = ((nums && nums.categorias) || []).map(c => Object.assign({}, c));
  for(const v of ventasLocalesPendientes()){
    const prod = datos.inventario.find(p => String(p.id) === String(v.perfume_id));
    if(!prod) continue;
    const nombre = String(prod.categoria || 'Sin categoría');
    let row = cats.find(c => c.nombre === nombre);
    if(!row){ row = { nombre, unidades: 0, costo: 0, venta: 0, ganancia: 0 }; cats.push(row); }
    const qty = num(v.cantidad) || 1;
    const costo = costoDe({ id: v.perfume_id });
    row.unidades = num(row.unidades) - qty;
    if(costo) row.costo = num(row.costo) - (num(costo.costo_crc) * qty);
    row.venta = num(row.venta) - (num(prod.precio_crc) * qty);
    row.ganancia = num(row.venta) - num(row.costo);  }
  return cats;
}

// Fechas siguientes al estilo día 1 / 16, a partir de una fecha.
function cuotasProg(primera, n){
  const fechas = [primera];
  const cur = new Date(primera + 'T12:00:00');
  for(let i = 0; i < 370 && fechas.length < n; i++){
    cur.setDate(cur.getDate() + 1);
    const dia = cur.getDate();
    if(dia === 1 || dia === 16) fechas.push(isoFecha(cur.getFullYear(), cur.getMonth(), cur.getDate()));
  }
  return fechas.slice(0, n);
}
function progDefaultFechasCel(){
  const a = proximaCuotaISO();
  return cuotasProg(a, 2);
}
function fechaCortaCel(iso){
  const [y, m, d] = String(iso || '').split('-');
  return d && m ? d + '/' + m : String(iso || '');
}

        const as = stockLocalDe(a) > 0 ? 0 : 1, bs = stockLocalDe(b) > 0 ? 0 : 1;
        if(as !== bs) return as - bs;
        return an.localeCompare(bn);
      })
      .slice(0, 12);
    if(!lista.length){
      box.innerHTML = `<div class="sug"><div><div class="nom">Sin resultados</div><div class="mar">Probá con otra marca o nombre</div></div></div>`;
      box.classList.remove('oculto');
      return;
    }
    box.innerHTML = lista.map(p => {
      const st = stockLocalDe(p);
      return `<div class="sug" data-pid="${esc(p.id)}">
        <div style="min-width:0">
          <div class="nom">${esc(p.nombre)}</div>
          <div class="mar">${esc(p.marca||'')}${p.ml ? ' · ' + esc(p.ml) + ' ml' : ''} · ${money(p.precio_crc)}</div>
        </div>
        <div class="st ${st > 0 ? 'ok' : 'no'}">${st > 0 ? st + ' en stock' : 'Sin stock'}</div>
      </div>`;
    }).join('');
    box.classList.remove('oculto');
    box.querySelectorAll('[data-pid]').forEach(el => {
      el.onclick = () => {
        const p = datos.inventario.find(x => String(x.id) === String(el.dataset.pid));
        if(p) agregarProducto(p, $cant());

    const monto = esPlan ? Math.min(num(abono.value), total) : total;
    const resto = Math.max(0, total - monto);
    const nCuotas = esPlan ? planN : 0;
    const partesPago = nCuotas > 0 ? repartirMonto(resto, nCuotas) : [];

function borrarVentaLocal(i){
  const lista = ventasLocales();
  const v = lista[i];
  if(!v) return;
  if(!confirm(`¿Borrar la venta de ${v.cliente} de este teléfono?\n\nNo toca el sistema de la PC.`)) return;
  lista.splice(i, 1);
  guardarVentasLocales(lista);
  pintarVentasLocales();
  toast('🗑 Venta borrada de este teléfono');
}

async function refrescarEstadoVentas(){
  const t = token();
  if(!t) return;
  try {
    const r = await fetch(API + '?action=movimientos&estado=pendiente&limite=200&token=' + encodeURIComponent(t) + '&t=' + Date.now());
    const j = await r.json();
    if(!j || !j.ok) return;
    const pend = new Set((j.movimientos || []).map(m => String(m.id)));
    const lista = ventasLocales();
    let cambio = false;
    lista.forEach(v => {
      const est = pend.has(String(v.id)) ? 'pendiente' : 'confirmada';
      if(v.estado !== est){ v.estado = est; cambio = true; }
    });
    if(cambio){
      guardarVentasLocales(lista);
      if(vista === 'cobros' || vista === 'numeros') render();
      else if(vista === 'stock') pintarLista();
    }
  } catch(e){ /* sin señal: se queda como estaba */ }
}

/* ---------------- Imagen tipo "Info" (misma que la web) para WhatsApp ---------------- */
function envolverTexto(ctx, texto, ancho){
  const salida = [];
  for(const parrafo of String(texto || '').split('\n')){
    const palabras = parrafo.split(/\s+/).filter(Boolean);
    if(!palabras.length){ salida.push(''); continue; }
    let linea = '';
    for(const w of palabras){
      const prueba = linea ? linea + ' ' + w : w;
      if(ctx.measureText(prueba).width > ancho && linea){ salida.push(linea); linea = w; }
      else linea = prueba;
    }
    if(linea) salida.push(linea);
  }
  return salida;
}
function rrect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
async function cargarFotoGrande(p){
  const urls = [fotoGrandeUrl(p), fotoUrl(p)].filter(Boolean);
  for(const u of urls){
    try {
      const r = await fetch(u, { cache: 'force-cache' });
      if(!r.ok) continue;
      const b = await r.blob();
      if(!/^image\//.test(b.type)) continue;
      return await createImageBitmap(b);
    } catch(e){ /* probamos la siguiente */ }
  }
  return null;
}
// Arma la imagen blanca con la foto, el nombre, el género, los ML, el precio y "A pagos"
// (el mismo estilo que el botón "Info" de la app de la PC).
async function imagenInfo(p){
  const bmp = await cargarFotoGrande(p);
  if(!bmp) return null;
  const W = 1080, M = 60, maxLado = 980;
  const esc = Math.min(maxLado / bmp.width, maxLado / bmp.height, 1);
  const iw = Math.round(bmp.width * esc), ih = Math.round(bmp.height * esc);
  const anchoTexto = W - M * 2;

  const precio = money(num(p.precio_crc));
  const pagos = money(num(p.precio_pagos_crc));
  const desc = String(p.descripcion || '').trim();
  const genImg = String(p.categoria||'') === 'Hombre' ? 'Fragancia de hombre'
               : String(p.categoria||'') === 'Mujer'  ? 'Fragancia de mujer'
               : String(p.categoria||'') === 'Unisex' ? 'Perfume unisex' : '';
  const mlTxt = num(p.ml) ? num(p.ml) + ' ML' : '';
  const FUENTE = "'Segoe UI', Roboto, Arial, sans-serif";

  const cm = document.createElement('canvas'); cm.width = W; cm.height = 10;
  const mc = cm.getContext('2d');
  mc.font = 'bold 50px ' + FUENTE;
  const lNombre = envolverTexto(mc, p.nombre, anchoTexto);
  mc.font = 'bold 46px ' + FUENTE;
  const wMl = mlTxt ? Math.ceil(mc.measureText(mlTxt).width) + 64 : 0;
  mc.font = '30px ' + FUENTE;
  const lDesc = desc ? envolverTexto(mc, desc, anchoTexto) : [];

  const hNombre = lNombre.length * 60;
  const hGen = genImg ? 48 : 0;
  const hMl = mlTxt ? 88 : 0;
  const hPrecio = 92, hPagos = 52;
  const DESC_LH = 42, DESC_GAP = 16;
  const hDesc = lDesc.length ? 30 + lDesc.reduce((s, ln) => s + (ln ? DESC_LH : DESC_GAP), 0) : 0;
  const H = M + ih + 34 + hNombre + hGen + hMl + 24 + hPrecio + hPagos + hDesc + M;

  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(bmp, (W - iw) / 2, M, iw, ih);

  let y = M + ih + 34;
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#171a21'; ctx.font = 'bold 50px ' + FUENTE;
  for(const ln of lNombre){ ctx.fillText(ln, M, y); y += 60; }
  if(genImg){
    ctx.fillStyle = '#8a6b1e'; ctx.font = 'bold 36px ' + FUENTE;
    ctx.fillText(genImg, M, y); y += 48;
  }
  if(mlTxt){
    const bh = 74, by = y + 2;
    ctx.fillStyle = '#c9a24b';
    rrect(ctx, M, by, wMl, bh, 20); ctx.fill();
    ctx.fillStyle = '#171a21'; ctx.font = 'bold 46px ' + FUENTE;
    ctx.fillText(mlTxt, M + 32, by + 13);
    y = by + bh + 12;
  }
  y += 24;
  ctx.fillStyle = '#c9a24b'; ctx.font = 'bold 72px ' + FUENTE;
  ctx.fillText(precio, M, y); y += 92;
  ctx.fillStyle = '#1f7a48'; ctx.font = 'bold 34px ' + FUENTE;
  ctx.fillText('A pagos: ' + pagos, M, y); y += 52;
  if(lDesc.length){
    y += 30; ctx.fillStyle = '#333a45'; ctx.font = '30px ' + FUENTE;
    for(const ln of lDesc){
      if(!ln){ y += DESC_GAP; continue; }
      ctx.fillText(ln, M, y); y += DESC_LH;
    }
  }
  return await new Promise(r => cv.toBlob(r, 'image/png'));
}

// Muestra la imagen para guardarla a mano (cuando el teléfono no deja compartir ni copiar).
function mostrarImagenParaGuardar(blob){
  const url = URL.createObjectURL(blob);
  const w = document.createElement('div');
  w.className = 'hoja-fondo';
  w.style.zIndex = 70;
  w.innerHTML = `<div class="hoja" style="text-align:center">
    <div class="agarre"></div>
    <h2>Imagen lista</h2>
    <div class="sub">Mantené presionada la imagen → “Guardar en Fotos” o “Compartir”.</div>
    <img src="${url}" style="width:100%;border-radius:12px;display:block">
    <div class="acciones"><button class="btn ghost" id="cerrar-img">Cerrar</button></div>
  </div>`;
  document.body.appendChild(w);
  w.querySelector('#cerrar-img').onclick = () => { URL.revokeObjectURL(url); w.remove(); };
}

// Entrega una imagen SIN link: portapapeles → guardar/mostrar. Devuelve true si la copió.
async function entregarImagen(blob, mensaje, texto){
  if(navigator.clipboard && window.ClipboardItem && window.isSecureContext){
    try {
      if(texto){
        try {
          await navigator.clipboard.write([ new ClipboardItem({
            'image/png': blob,
            'text/plain': new Blob([texto], { type: 'text/plain' }),
          }) ]);
        } catch(e){
          await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
        }
      } else {
        await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
      }
      toast(mensaje || '🖼 Imagen copiada — pegala en WhatsApp');
      return true;
    } catch(e){ /* el teléfono no deja copiar imágenes: la guardamos */ }
  }
  guardarImagenEnTelefono(blob);
  return false;
}

// Envía la imagen SIN ningún link: 1) portapapeles  2) guardarla para mandarla como foto.
async function enviarImagenWhatsApp(p){
  toast('🖼 Armando la imagen…');
  let blob = null;
  try { blob = await imagenInfo(p); } catch(e){ blob = null; }
  if(!blob){
    await copiar(textoInfo(p), '📋 Sin foto: copié el texto');
    return;
  }
  await entregarImagen(blob, '🖼 Imagen copiada — abrí WhatsApp y pegala');
}

// Guarda la imagen en el teléfono (o la muestra para guardarla a mano). Nunca manda el link.
function guardarImagenEnTelefono(blob){
  const esIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(esIOS){ mostrarImagenParaGuardar(blob); return; }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'king-quepoa-perfume.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('🖼 Imagen guardada — mandala como foto en WhatsApp');
  } catch(e){
    mostrarImagenParaGuardar(blob);
  }
}

/* ---------------- factura de cobro (igual a la de la PC) ---------------- */
const MESES_LARGOS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS_LARGOS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function fmtFechaLarga(s){
  const v = String(s || '').slice(0, 10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return '—';
  const [y, m, d] = v.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return `${DIAS_LARGOS[dt.getDay()]} ${String(d).padStart(2,'0')}-${MESES_LARGOS[m-1]}-${y}`;
}
function fmtFechaCorta(s){
  const v = String(s || '').slice(0, 10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return '—';
  return v.split('-').reverse().join('/');
}
function hoyISO(){

// Plan de pagos de una venta: la PC lo manda en la columna "cuotas" de COBROS.
const _cuotasCache = new WeakMap();
function cuotasDe(v){
  if(v && typeof v === 'object' && _cuotasCache.has(v)) return _cuotasCache.get(v);
  let arr = [];
  const raw = v && v.cuotas;
  if(Array.isArray(raw)) arr = raw;
  else if(typeof raw === 'string' && raw.trim()){
    try { const j = JSON.parse(raw); if(Array.isArray(j)) arr = j; } catch(e){ /* formato viejo */ }
  }
  const out = arr.map((x, i) => ({
    numero: num(x.n || x.numero) || (i + 1),
    monto: num(x.m != null ? x.m : x.monto),
    vencimiento: String(x.f || x.vencimiento || '').slice(0, 10),
    pagada: !!(x.p != null ? num(x.p) : x.pagada),
    tipo: String(x.t || x.tipo || 'abono')
  }));
  if(v && typeof v === 'object') _cuotasCache.set(v, out);
  return out;
}
// Misma etiqueta que usa la PC: Prima / Primer abono / Último abono.
function etiquetaCuota(v, cuotas, i){
  const c = cuotas[i];
  if(!c) return '';
  const total = cuotas.length;
  if(c.tipo === 'prima') return (total && i === total - 1) ? 'Última prima' : 'Prima';
  let n = 0;
  for(let j = 0; j <= i; j++) if(cuotas[j] && cuotas[j].tipo !== 'prima') n++;
  n = Math.max(1, n);
  if(total && i === total - 1) return 'Último abono';
  return ['', 'Primer abono', 'Segundo abono', 'Tercer abono', 'Cuarto abono', 'Quinto abono', 'Sexto abono'][n] || ('Abono ' + n);
}
// Plan "de respaldo" cuando el Apps Script todavía no manda las cuotas:
// usa el próximo vencimiento y el monto que ya venían en COBROS.
function planDeVenta(v){
  const arr = cuotasDe(v);
  if(arr.length) return { arr: arr, completo: true };
  const n = Math.max(num(v && v.pendientes), 1);
  const saldo = num(v && v.saldo);
  const prox = num(v && v.proximo_monto) > 0 ? num(v.proximo_monto) : Math.round(saldo / n);
  return {
    arr: [{ numero: 1, monto: prox, vencimiento: String((v && v.proximo) || '').slice(0,10), pagada: false, tipo: 'abono' }],
    completo: false
  };
}
// La foto del perfume: la que manda la PC o, si no, la del catálogo que ya tiene la app.
function claveProd(s){
  return norm(s).replace(/[^a-z0-9]/g, '');
}
function productoDeCobro(v){
  const id = String((v && v.producto_id) || '');
  if(id){
    const porId = datos.inventario.find(x => String(x.id) === id);
    if(porId) return porId;
  }
  const n = claveProd(v && v.producto);
  if(!n) return null;
  let p = datos.inventario.find(x => claveProd(x.nombre) === n);
  if(!p) p = datos.inventario.find(x => {
    const k = claveProd(x.nombre);
    return k.includes(n) || n.includes(k);
  });
  return p || null;
}
function fotoDeCobro(v){
  const p = productoDeCobro(v);
  const foto = String((v && v.foto) || (p && p.foto) || '');
  return foto ? { foto: foto } : null;
}
async function cargarBitmap(url){
  try {
    const r = await fetch(url, { cache: 'force-cache' });
    if(!r.ok) return null;
    const b = await r.blob();
    if(!/^image\//.test(b.type)) return null;
    return await createImageBitmap(b);
  } catch(e){ return null; }
}
// Toca una fila de Cobros: el ticket sale con TODAS las ventas pendientes del cliente,
// con foto y con el plan de pagos completo, igual que el botón 📲 de la PC.
function clienteDeCobro(c){
  const nombre = String((c && c.cliente) || '').trim();
  const tel = String((c && c.telefono) || '').replace(/\D/g,'');
  let ventas = cobrosTodos().filter(x => nombre
    ? norm(x.cliente) === norm(nombre)

  if(!ventas.length) ventas = [c];
  ventas = ventas.slice().sort((a,b) => String(a.fecha_venta || '').localeCompare(String(b.fecha_venta || '')));
  return { nombre: nombre, tel: tel, ventas: ventas };
}

let cobrosError = '';

function textoCobro(c){
  const sel = seleccionCobroCel(c);
  if(sel.v) return textoCobroCel(sel.v);
  const cli = (c && c.ventas) ? c : { nombre: (c && (c.cliente || c.nombre)) || '', ventas: c ? [c] : [] };
  const total = (cli.ventas || []).reduce((s, v) => s + num(v.saldo), 0);
  return `¡Hola ${primerNombreDe(cli.nombre)}! 👋\nTenés un saldo pendiente de ${money(total)}.`;
}

// Mientras la PC no aplica un abono, Google todavía muestra el saldo viejo.
// Esto descuenta los abonos recién hechos para que la venta no reaparezca
// en Por cobrar después de haberla cobrado.
function aplicarAbonosPendientes(lista){
  if(!abonosPendientes.length) return lista;
  const ahora = Date.now();
  const out = [];
  const quedan = [];
  for(const c of lista){
    const pend = abonosPendientes.filter(a => String(a.venta_id) === String(c.venta_id));
    if(!pend.length){ out.push(c); continue; }
    const noAplicados = pend.filter(a => !(num(c.saldo) <= num(a.saldoAntes) - num(a.monto) + 0.5));
    if(!noAplicados.length){ out.push(c); continue; }  // la PC ya lo aplicó
    const total = noAplicados.reduce((s,a) => s + num(a.monto), 0);
    const saldo = Math.max(0, num(c.saldo) - total);
    if(saldo > 0.5){
      out.push(Object.assign({}, c, { saldo, abonado: num(c.abonado) + total }));
      quedan.push(...noAplicados);
    }
  }
  for(const a of abonosPendientes){
    if(!lista.some(c => String(c.venta_id) === String(a.venta_id))) quedan.push(a);
  }
  abonosPendientes = quedan.filter(a => ahora - a.ts < 30 * 60 * 1000);
  guardarLS(LS.abonosPend, abonosPendientes);
  return out;
}

async function cargarCobros(mostrar){
  const t = token();
  if(!t){ if(mostrar) toast('Falta la clave en Ajustes', 'error'); return; }
  if(mostrar) toast('Actualizando…');
  try {
    // Cobros (pendientes) y Números (historial, para la pestaña Cobrados).
    // Se piden juntos para que al terminar un cobro la venta pase de lado sola.
    const [rc, rn] = await Promise.allSettled([
      fetch(API + '?action=cobros&token=' + encodeURIComponent(t) + '&t=' + Date.now()),
      fetch(API + '?action=numeros&token=' + encodeURIComponent(t) + '&t=' + Date.now())
    ]);
    if(rc.status !== 'fulfilled') throw (rc.reason || new Error('Sin señal'));
    const j = await rc.value.json();
    if(!j || !j.ok) throw new Error((j && j.error) || 'No se pudo leer la lista');
    cobros = Array.isArray(j.cobros) ? j.cobros : [];
    cobros = aplicarAbonosPendientes(cobros);
    cobrosError = '';
    guardarLS(LS.cobros, { cobros, guardado: Date.now() });
    if(rn.status === 'fulfilled'){
      try {
        const jn = await rn.value.json();
        if(jn && jn.ok && jn.numeros){
          nums = jn.numeros;
          numsError = '';
          guardarLS(LS.numeros, { nums: nums, guardado: Date.now() });
        } else {
          numsError = 'No se pudieron leer las ventas cobradas.';
        }
      } catch(_) { numsError = 'No se pudieron leer las ventas cobradas.'; }
    } else {
      numsError = 'No se pudieron leer las ventas cobradas.';
    }
    if(vista === 'cobros') render();
    if(mostrar) toast('Cobros actualizados');
  } catch(e) {
    cobrosError = /desconocida/i.test(e.message)
      ? 'Falta actualizar el script de Google (versión 1.1).'
      : e.message;
    if(vista === 'cobros') render();
    if(mostrar) toast(cobrosError, 'error');
  }
}

// para que la venta aparezca en Cobrados sin borrar el agradecimiento.
function programarRefrescoCobros(intentos = 0){
  setTimeout(() => {
    if(vista !== 'cobros') return;

    if(el && el.style.display !== 'none' && intentos < 6){
      programarRefrescoCobros(intentos + 1);

}

function abrirAbono(c){
  if(!c) return;
  const saldo = num(c.saldo);
  const pend = Math.max(num(c.pendientes), 1);
  const sugerido = num(c.proximo_monto) > 0 ? num(c.proximo_monto) : Math.round(saldo / pend);
  const hoy = new Date();
  const fechaHoy = isoFecha(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
  const wrap = $('#hoja-wrap');
  wrap.innerHTML = `<div class="hoja-fondo">
    <div class="hoja">
      <div class="agarre"></div>
      <h2>Registrar abono</h2>
      <div class="sub">${esc(c.cliente)} · ${esc(c.producto || '')}</div>
      <div class="aviso" style="margin:12px 0">Saldo pendiente: <b>${money(saldo)}</b></div>
      <label class="f"><span>Monto del abono ₡</span><input id="ab-monto" type="number" min="1" step="100" value="${sugerido}" inputmode="numeric"></label>
      <label class="f"><span>Fecha</span><input id="ab-fecha" type="date" value="${fechaHoy}"></label>
      <div id="ab-resumen" class="hint"></div>
      <label class="f"><span>Cómo aplicarlo</span><select id="ab-modo">
        <option value="cuota">A la próxima cuota</option>
        <option value="repartir">Repartir entre los pagos que faltan</option>
      </select></label>
      <div style="display:grid;gap:8px;margin-top:10px">
        <button class="btn" id="ab-guardar">Registrar abono</button>
        <button class="btn ghost" id="ab-cancelar">Cancelar</button>
      </div>
    </div>
  </div>`;
  const cerrar = () => { wrap.innerHTML = ''; };
  const act = () => {
    const m = Math.min(num($('#ab-monto').value), saldo);
    $('#ab-resumen').textContent = m > 0 ? `Quedaría un saldo de ${money(Math.max(0, saldo - m))}` : '';
  };
  $('#ab-monto').addEventListener('input', act);
  act();
  $('#ab-cancelar').onclick = cerrar;
  $('.hoja-fondo').addEventListener('click', e => { if(e.target.classList.contains('hoja-fondo')) cerrar(); });
  $('#ab-guardar').onclick = async () => {
    const t = token();
    if(!t) return toast('Falta la clave en Acceso', 'error');
    const monto = Math.min(num($('#ab-monto').value), saldo);
    if(!(monto > 0)) return toast('Escribí el monto del abono', 'error');
    const fecha = $('#ab-fecha').value || fechaHoy;
    const btn = $('#ab-guardar');
    btn.disabled = true; btn.textContent = 'Registrando…';
    try {
      const marca = '[[KQV:' + JSON.stringify({ venta_id: Number(c.venta_id), repartir: $('#ab-modo').value === 'repartir' || undefined }) + ']]';
      const r = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'movimiento', token: t, tipo: 'abono',
          cliente: c.cliente || '', telefono: c.telefono || '', monto: monto,
          fecha: fecha, nota: 'Abono desde el celular ' + marca,
          dispositivo: 'app-celular'
        })
      });
      const j = await r.json();
      if(!j || !j.ok) throw new Error((j && j.error) || 'Google rechazó el abono');
      cerrar();
      const restante = Math.max(0, saldo - monto);
      // Guarda el abono como pendiente hasta que la PC lo refleje en COBROS,
      // así la venta no reaparece con el saldo viejo al refrescar.
      abonosPendientes.push({ venta_id: Number(c.venta_id), monto, saldoAntes: saldo, ts: Date.now() });
      guardarLS(LS.abonosPend, abonosPendientes);
      // Refleja el abono de inmediato en el teléfono: si terminó de pagar,
      // la venta sale de Por cobrar y se ofrece el agradecimiento en el acto.
      const idx = cobros.findIndex(x => String(x.venta_id) === String(c.venta_id));
      if(idx >= 0){
        if(restante <= 0.5) cobros.splice(idx, 1);
        else cobros[idx] = Object.assign({}, cobros[idx], { saldo: restante, abonado: num(cobros[idx].abonado) + monto });
        guardarLS(LS.cobros, { cobros, guardado: Date.now() });
      }
      if(vista === 'cobros') render();
      if(restante <= 0.5) mostrarCobroPagado(c, monto);
      else mostrarConfirmacionCobro(`✅ Abono de ${money(monto)} anotado · ${c.cliente} · Saldo ${money(restante)}`);
      // La PC aplica el abono en segundos; refrescamos para que pase a Cobrados.
      programarRefrescoCobros();
    } catch(e){
      toast(e.message || 'No se pudo registrar', 'error');
      btn.disabled = false; btn.textContent = 'Registrar abono';
    }
  };
}

/* ---------------- Mis números (privado: con clave) ---------------- */
async function cargarNumeros(mostrar){
  const t = token();
  if(!t){ if(mostrar) toast('Falta la clave en Acceso', 'error'); return; }
  if(cargandoNums) return;
  cargandoNums = true;
  if(mostrar) toast('Actualizando…');
  try {
    const r = await fetch(API + '?action=numeros&token=' + encodeURIComponent(t) + '&t=' + Date.now());
    const j = await r.json();
    if(!j || !j.ok) throw new Error((j && j.error) || 'No se pudo leer Mis números');
    nums = j.numeros || null;
    numsError = '';
    guardarLS(LS.numeros, { nums: nums, guardado: Date.now() });
    if(vista === 'numeros' || vista === 'cobros') render();
    if(mostrar) toast('Números actualizados');
  } catch(e) {
    numsError = /desconocida/i.test(e.message)
      ? 'Falta actualizar el script de Google (versión 1.5).'
      : (e.message || 'Sin señal');
    if(vista === 'numeros' || vista === 'cobros') render();
    if(mostrar) toast(numsError, 'error');
  } finally {
    cargandoNums = false;
  }
}

// Sticker de agradecimiento (mismo diseño que la PC)
async function imagenGraciasCel(v){
  let logo = await cargarBitmap('./logo-gracias.png');
  if(!logo) logo = await cargarBitmap('./logo.png');
  if(!logo) return null;
  const W = 2000;
  const logoH = Math.round(W * logo.height / logo.width);
  const nombre = primerNombreDe(v.cliente).toUpperCase();
  const producto = (String(v.perfume || '') + (num(v.cantidad) > 1 ? ' × ' + num(v.cantidad) : '')).trim();
  const saludo = nombre ? `¡GRACIAS, ${nombre}!` : '¡GRACIAS POR TU COMPRA!';

  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  cv.width = W; cv.height = 10;
  const maxTxt = W - 180;
  ctx.font = "bold 80px Georgia, 'Times New Roman', serif";
  const lSaludo = envolverTexto(ctx, saludo, maxTxt).slice(0, 2);
  ctx.font = "bold 54px 'Segoe UI', Arial, sans-serif";
  const lProd = producto ? envolverTexto(ctx, producto, maxTxt).slice(0, 2) : [];

  const H = logoH + 70 + lSaludo.length * 96 + (producto ? 60 + lProd.length * 68 : 0) + 70;
  cv.height = H;
  ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(logo, 0, 0, W, logoH);

  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  let y = logoH + 70;
  ctx.fillStyle = '#c9a24b'; ctx.font = "bold 80px Georgia, 'Times New Roman', serif";
  for(const ln of lSaludo){ ctx.fillText(ln, W / 2, y); y += 96; }
  if(producto){
    ctx.fillStyle = '#98a0af'; ctx.font = "46px 'Segoe UI', Arial, sans-serif";
    ctx.fillText('por tu compra de', W / 2, y); y += 60;
    ctx.fillStyle = '#e8eaf0'; ctx.font = "bold 54px 'Segoe UI', Arial, sans-serif";
    for(const ln of lProd){ ctx.fillText(ln, W / 2, y); y += 68; }
  }
  return await new Promise(r => cv.toBlob(r, 'image/png'));
}

/* ---------------- Cotizar (solo dueño) ---------------- */
function tcCel(){
  const rows = (costos && Array.isArray(costos.costos)) ? costos.costos : [];
  const t = rows.find(r => num(r.tc) > 0);
  if(t) return num(t.tc);
  const n = nums && nums.resumen && num(nums.resumen.tc);
  return n > 0 ? n : 470;
}

function margenesCel(){
  const rows = (costos && Array.isArray(costos.costos)) ? costos.costos : [];
  for(const r of rows){
    try {
      const j = JSON.parse(r.margenes || '[]');
      if(Array.isArray(j) && j.length) return j;
    } catch(e){}
  }
  return [];
}

function margenPctCel(costoUsd){
  const m = margenesCel().find(r => (Number(costoUsd) || 0) <= Number(r.max));
  return m ? num(m.pct) : null;
}

function precioSugeridoCel(costoUsd, p){
  const tc = tcCel();
  const pct = margenPctCel(costoUsd);
  if(pct != null) return { precio: mil((Number(costoUsd) || 0) * tc * (1 + pct / 100)), pct, fuente: 'tabla' };
  const c = p ? costoDe(p) : null;
  const price = p ? num(p.precio_crc) : 0;
  if(c && price > 0){
    const pctEf = ((price - num(c.costo_crc)) / price) * 100;
    if(pctEf > 0) return { precio: mil((Number(costoUsd) || 0) * tc * (1 + pctEf / 100)), pct: pctEf, fuente: 'producto' };
  }
  return null;
}

function distribuidoresConocidos(){
  const set = new Set();
  [...cotizacionesTmp, ...porComprar].forEach(c => {
    const d = String((c && c.distribuidor) || '').trim();
    if(d) set.add(d);
  });
  return [...set].sort((a, b) => a.localeCompare(b, 'es'));
}

function agruparCotizaciones(lista){
  const map = new Map();
  for(const c of lista){
    const k = norm(c.producto);
    if(!map.has(k)) map.set(k, { producto: c.producto, items: [] });
    map.get(k).items.push(c);
  }
  return [...map.values()]
    .map(g => ({ ...g, items: g.items.slice().sort((a, b) => num(a.costo_crc) - num(b.costo_crc)) }))
    .sort((a, b) => a.producto.localeCompare(b.producto, 'es'));
}

function detalleCotizacion(c){
  const tc = num(c.tc) || tcCel();
  const partes = [];
  partes.push(`Costo: <b>${c.moneda === 'CRC' ? money(c.monto) : usd(c.monto)}</b> · ${c.moneda === 'CRC' ? usd(c.costo_usd) : money(c.costo_crc)}`);
  partes.push(`Tipo de cambio: ₡${tc}`);
  if(num(c.costo_actual_crc) > 0){
    const dif = num(c.costo_actual_crc) - num(c.costo_crc);
    const pct = (num(c.costo_actual_crc) > 0) ? (dif / num(c.costo_actual_crc)) * 100 : 0;
    partes.push(dif >= 0
      ? `Tu costo actual: <b>${money(c.costo_actual_crc)}</b> · este distribuidor está <b style="color:var(--green)">${pct.toFixed(1)}% más barato</b> (ahorrás ${money(dif)})`
      : `Tu costo actual: <b>${money(c.costo_actual_crc)}</b> · este distribuidor está <b style="color:var(--red)">${Math.abs(pct).toFixed(1)}% más caro</b> (${money(Math.abs(dif))} más)`);
  }
  if(num(c.precio_actual) > 0) partes.push(`Tu precio de venta actual: <b>${money(c.precio_actual)}</b>`);
  if(num(c.precio_final) > 0){
    partes.push(`Precio final con tu margen: <b style="color:var(--gold2)">${money(c.precio_final)}</b>`);
    partes.push(`Ganancia: <b>${money(c.ganancia)}</b> · Margen: <b>${num(c.margen_tabla).toFixed(1)}%</b>`);
  } else {
    partes.push('Precio final: actualizá el script de Google a la versión 1.5.3 para tener la tabla de márgenes.');
  }
  if(c.fecha) partes.push(`<span style="font-size:11px">${new Date(c.fecha).toLocaleDateString('es-CR')}</span>`);
  return partes.join('<br>');
}

function guardarParaComprar(cot){

function mostrarSugCot(){
  const box = $('#ct-sug');
  if(!box) return;
  const q = norm($('#ct-buscar').value);
  if(q.length < 2){ box.classList.add('oculto'); box.innerHTML = ''; return; }
  const lista = datos.inventario
    .filter(p => norm(p.nombre).includes(q) || norm(p.marca).includes(q))
    .slice(0, 8);
  if(!lista.length){ box.classList.add('oculto'); box.innerHTML = ''; return; }
  box.innerHTML = lista.map(p => `<div class="sug" data-ct="${esc(p.id)}">
    <span>${esc(p.nombre)}</span><span class="s-mar">${esc(p.marca || '')}</span>
  </div>`).join('');
  box.classList.remove('oculto');
}

function calcularCotizacion(){
  $('#ct-sug').classList.add('oculto');
  const pid = $('#ct-prod').value;
  const p = pid ? datos.inventario.find(x => String(x.id) === String(pid)) : null;
  const nombre = p ? p.nombre : $('#ct-buscar').value.trim();
  if(!nombre) return toast('Elegí o escribí un perfume', 'error');
  const distribuidor = $('#ct-dist').value.trim() || 'Sin distribuidor';
  const monto = num($('#ct-monto').value);
  if(!(monto > 0)) return toast('Escribí el costo', 'error');
  const moneda = $('#ct-moneda').value === 'USD' ? 'USD' : 'CRC';
  const tc = tcCel();
  const costoUsd = moneda === 'USD' ? monto : monto / tc;
  const costoCrc = moneda === 'CRC' ? monto : monto * tc;
  const costoAct = p ? costoDe(p) : null;
  const costoActCrc = costoAct ? num(costoAct.costo_crc) : 0;
  const precioAct = p ? num(p.precio_crc) : 0;
  const sug = precioSugeridoCel(costoUsd, p);
  const dif = costoActCrc > 0 ? costoActCrc - costoCrc : 0;
  const pct = costoActCrc > 0 ? (dif / costoActCrc) * 100 : 0;

  const cot = {
    id: 'COT-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
    producto: nombre,
    producto_id: p ? p.id : '',
    distribuidor: distribuidor,
    monto: monto,
    moneda: moneda,
    tc: tc,
    costo_usd: Math.round(costoUsd * 100) / 100,
    costo_crc: Math.round(costoCrc),
    costo_actual_crc: Math.round(costoActCrc),
    precio_actual: Math.round(precioAct),
    precio_final: sug ? sug.precio : 0,
    margen_tabla: sug ? sug.pct : 0,
    ganancia: sug ? sug.precio - Math.round(costoCrc) : 0,
    dif_costo: Math.round(dif),
    dif_pct: pct,
    fecha: new Date().toISOString(),
  };

  const k = norm(cot.producto) + '|' + norm(cot.distribuidor);
  cotizacionesTmp = cotizacionesTmp.filter(x => (norm(x.producto) + '|' + norm(x.distribuidor)) !== k);
  cotizacionesTmp.unshift(cot);

  const res = $('#ct-resultado');
  res.innerHTML = `<div class="aviso" style="margin-top:12px">
    <div style="font-weight:700">${esc(cot.producto)} · ${esc(cot.distribuidor)}</div>
    <div style="font-size:12.5px;margin-top:5px">${detalleCotizacion(cot)}</div>
    <div class="fila" style="margin-top:8px;gap:6px;flex-wrap:wrap">
      <button class="btn sm" id="ct-save-result">💾 Guardar para comprar</button>
    </div>
  </div>`;
  const b = $('#ct-save-result');
  if(b) b.onclick = () => guardarParaComprar(cot);
  pintarTmpCotizaciones();
  pintarDatalistDist();
}

async function subirNotaAuto(n){
  if(!n || n.subida) return true;
  const t = token();
  if(!t){ n.error = 'Falta la clave'; return false; }
  try {
    const r = await fetch(API, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'aviso', token:t, texto:n.texto, fecha:new Date(n.ts).toISOString(), dispositivo:'app-celular' })
    });
    const j = await r.json();
    if(j && j.ok){ n.subida = true; n.idRemoto = j.id; n.error = ''; guardarNotas(); return true; }
    n.error = (j && j.error) || 'Google rechazó la nota';
  } catch(e){
    n.error = e.message || 'Sin señal';
  }
  guardarNotas();
  return false;
}

async function subirNotasPendientes(silencioso){
  if(!token()) return;
  const pend = notas.filter(n => !n.subida);
  if(!pend.length) return;
  let ok = 0;
  for(const n of pend){
    if(await subirNotaAuto(n)) ok++;
    else break;
  }
  guardarNotas();
  if(vista === 'notas') pintarListaNotas();
  if(ok) toast(`☁️ ${ok} nota${ok===1?'':'s'} subida${ok===1?'':'s'} a la PC`);
  else if(!silencioso) toast('No se pudo subir: ' + mensajeGoogle(pend[0] && pend[0].error), 'error');
}

function mensajeGoogle(e){
  const m = String((e && e.message) || e || '');
  if(/desconocida/i.test(m)) return 'Falta actualizar el script de Google (versión 1.2).';
  return m;
}

function numeroNegocio(){
  const n = String((datos.config && datos.config.wa_numero) || '').replace(/\D/g,'');
  return n || '50664431076';
}

function enviarNotaWhatsApp(n){
  if(!n) return;
  const f = new Date(n.ts).toLocaleString('es-CR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  const txt = `📝 Recordatorio · King Quepoa\n\n${n.texto}\n\n${f}`;
  abrirWhatsApp(txt, numeroNegocio());
}

async function borrarNota(i){
  const n = notas[i];
  if(!n) return;
  const donde = n.subida ? 'del teléfono y de Google' : 'del teléfono';
  if(!confirm(`¿Borrar esta nota ${donde}?`)) return;

  if(n.subida && n.idRemoto){
    const t = token();
    if(!t) return toast('Falta la clave en Ajustes', 'error');
    try {
      const r = await fetch(API, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'borrar', token:t, ids:[n.idRemoto] })
      });
      const j = await r.json();
      if(!j || !j.ok) throw new Error((j && j.error) || 'No se pudo borrar en Google');
    } catch(e){
      toast('No se borró en Google: ' + mensajeGoogle(e), 'error');
      return;
    }
  }

  notas.splice(i, 1);
  guardarNotas();
  render();
  toast('Nota borrada');
}

async function subirNota(n, btn){  if(!n) return;
  const t = token();
  if(!t) return toast('Poné la clave en Ajustes', 'error');
  const texto = btn.textContent;
  btn.disabled = true;
  btn.textContent = '…';
  try {
    const r = await fetch(API, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'aviso', token:t, texto:n.texto, fecha:new Date(n.ts).toISOString(), dispositivo:'app-celular' })
    });
    const j = await r.json();
    if(!j || !j.ok) throw new Error((j && j.error) || 'No se pudo subir');
    n.subida = true;
    n.idRemoto = j.id;
    guardarNotas();
    render();
    toast('☁️ Nota subida a Google');
  } catch(e){
    toast(mensajeGoogle(e), 'error');
    btn.disabled = false;
    btn.textContent = texto;
  }
}
