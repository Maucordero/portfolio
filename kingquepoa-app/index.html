<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="description" content="King Quepoa · inventario y mensajes de la perfumería">
<title>King Quepoa</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon-v2.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="King Quepoa">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0e1014;--panel:#151820;--panel2:#1b1f28;--panel3:#232936;
    --line:#262b36;--line2:#333a49;--text:#e8eaf0;--muted:#98a0af;
    --gold:#c9a24b;--gold2:#e6c87e;--green:#3ecf8e;--red:#f0575d;--blue:#5aa9ff;
    --r:14px;--r-sm:10px;
  }
  html,body{margin:0;min-height:100%}
  body{
    background:var(--bg);color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-bottom:calc(110px + env(safe-area-inset-bottom));
    overscroll-behavior-y:contain;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  h1,h2,h3,p{margin:0}
  .oculto{display:none !important}

  header{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:11px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
    background:rgba(14,16,20,.93);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  header img{width:36px;height:36px;border-radius:10px;flex:none}
  header .t{flex:1;min-width:0}
  header b{display:block;font-size:15px;letter-spacing:.2px}
  header small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header small b{display:inline;font-weight:600;color:var(--green)}
  .icono{
    background:var(--panel2);border:1px solid var(--line);color:var(--text);
    width:40px;height:40px;border-radius:11px;font-size:18px;line-height:1;
  }
  .icono:active{background:var(--panel3)}

  main{padding:14px 14px 22px}
  .titulo{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}

  .buscador{position:relative;margin-bottom:10px}
  .buscador input{
    width:100%;padding:12px 14px 12px 40px;border-radius:var(--r);
    background:var(--panel);border:1px solid var(--line);outline:none;
  }
  .buscador input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.15)}
  .buscador span{position:absolute;left:13px;top:11px;color:var(--muted);font-size:16px}

  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    white-space:nowrap;padding:8px 13px;border-radius:999px;font-size:13px;
    background:var(--panel);border:1px solid var(--line);color:var(--muted)
  }
  .chip.on{background:rgba(201,162,75,.14);border-color:rgba(201,162,75,.5);color:var(--gold2)}

  .prod{
    display:flex;gap:12px;align-items:flex-start;padding:12px;margin-bottom:10px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  }
  .prod:active{background:var(--panel2)}
  .foto{
    width:54px;height:54px;border-radius:12px;flex:none;overflow:hidden;
    background:var(--panel2);display:grid;place-items:center;font-size:22px
  }
  .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .foto img.logo-fallback{object-fit:contain;padding:10px;opacity:.55}
  .prod .info{flex:1;min-width:0}
  /* Miniatura grande: la foto ocupa todo el alto del lado izquierdo */
  .prod-foto{padding:0;align-items:stretch;overflow:hidden;min-height:112px}
  .prod-foto .foto{width:112px;height:auto;align-self:stretch;border-radius:0;flex:0 0 112px}
  .prod-foto .foto img{height:100%;border-radius:0}
  .prod-foto .info{padding:12px 12px 12px 10px;display:flex;flex-direction:column;justify-content:center}
  .prod .nom{font-weight:600;font-size:14.5px;line-height:1.3;margin-bottom:2px}
  .prod .mar{font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .precio{color:var(--gold2);font-weight:700;font-size:14.5px}
  .pagos{font-size:12px;color:var(--muted)}
  .abono{font-size:12px;color:var(--gold2)}
  .stock{
    font-size:11px;padding:3px 8px;border-radius:999px;
    background:rgba(62,207,142,.12);border:1px solid rgba(62,207,142,.35);color:var(--green)
  }
  .stock.cero{background:rgba(240,87,93,.1);border-color:rgba(240,87,93,.35);color:var(--red)}
  .tag{
    font-size:11px;padding:3px 8px;border-radius:999px;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted)
  }

  .vacio{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}
  .vacio .em{font-size:34px;display:block;margin-bottom:8px}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;overflow:hidden}
  .card h3{font-size:14px;margin-bottom:4px}
  .hint{font-size:12.5px;color:var(--muted)}

  label.f{display:block;margin-bottom:12px}
  label.f > span{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  input,select,textarea{
    width:100%;padding:12px;border-radius:var(--r-sm);
    background:var(--panel2);border:1px solid var(--line);outline:none;
    min-width:0;max-width:100%
  }
  input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,162,75,.14)}
  textarea{resize:vertical;min-height:76px}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--panel2);padding:5px;border-radius:12px;border:1px solid var(--line);margin-bottom:14px}
  .seg button{background:none;border:0;color:var(--muted);padding:10px 4px;border-radius:9px;font-size:13.5px}
  .seg button.on{background:rgba(201,162,75,.15);color:var(--gold2);font-weight:600}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:13px 16px;border-radius:12px;border:0;font-weight:600;font-size:14.5px;
    background:var(--gold);color:#171307;width:100%
  }
  .btn:active{filter:brightness(.95)}
  .btn:disabled{opacity:.55}
  .btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
  .btn.verde{background:var(--green);color:#06281b}
  .btn.rojo{background:transparent;border:1px solid rgba(240,87,93,.5);color:var(--red)}
  .btn.sm{padding:9px 12px;font-size:13px;width:auto}

  .lista-mini{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .mini{
    display:flex;gap:10px;align-items:flex-start;padding:10px 12px;
    background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm)
  }
  .mini .c{flex:1;min-width:0}
  .mini .c b{display:block;font-size:13.5px}
  .mini .c small{color:var(--muted);font-size:11.5px}
  .estado-mini{font-size:11px;white-space:nowrap}
  .estado-mini.ok{color:var(--green)}
  .estado-mini.pend{color:var(--gold)}

  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
    gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    background:rgba(21,24,32,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line)
  }
  nav button{
    background:none;border:0;color:var(--muted);font-size:10.5px;min-width:0;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:11px
  }
  nav button i{font-style:normal;font-size:20px;line-height:1}
  nav button.activo{color:var(--gold);background:rgba(201,162,75,.09)}

  .hoja-fondo{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.62);display:flex;align-items:flex-end}
  .hoja{
    width:100%;max-height:90vh;overflow:auto;background:var(--panel);
    border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
    padding:8px 16px calc(20px + env(safe-area-inset-bottom))
  }
  .hoja .agarre{width:44px;height:4px;border-radius:2px;background:var(--line2);margin:6px auto 14px}
  .hoja h2{font-size:17px;line-height:1.25;margin-bottom:3px}
  .hoja .sub{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .hoja .cuerpo{font-size:13.5px;color:#d7dbe5;white-space:pre-wrap;line-height:1.5;margin:12px 0}  .hoja .precios{display:flex;gap:10px;margin:12px 0}
  .foto-grande{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0 12px;text-align:center}
  .foto-grande img{max-width:100%;max-height:280px;border-radius:8px;display:block;margin:0 auto}
  .hoja .precios div{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
  .hoja .precios small{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
  .hoja .precios b{font-size:15px;color:var(--gold2)}
  .hoja .precios div.p b{color:var(--green)}
  .hoja .acciones{display:grid;gap:8px;margin-top:14px}

  .toast{
    position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
    background:#232936;border:1px solid var(--line2);color:var(--text);
    padding:11px 16px;border-radius:12px;font-size:13.5px;z-index:60;
    opacity:0;pointer-events:none;transition:.18s;max-width:88vw;text-align:center
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .toast.error{border-color:rgba(240,87,93,.6);color:#ffd7d9}
  .oculto{display:none!important}

  pre.catalogo{
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;
    padding:13px;font:12.5px/1.55 ui-monospace,Consolas,monospace;
    white-space:pre-wrap;word-break:break-word;margin:10px 0
  }
  .punto{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--green);margin-right:5px}
  .punto.off{background:var(--red)}
  .aviso{
    font-size:12.5px;padding:10px 12px;border-radius:10px;margin-bottom:12px;
    background:rgba(201,162,75,.1);border:1px solid rgba(201,162,75,.35);color:var(--gold2)
  }
  .aviso.ok{
    background:rgba(62,207,142,.1);border-color:rgba(62,207,142,.35);color:var(--green)
  }
  .sugerencias-app{
    position:absolute;left:0;right:0;top:100%;z-index:40;margin-top:4px;
    background:var(--panel2);border:1px solid var(--line2);border-radius:10px;
    box-shadow:0 12px 30px rgba(0,0,0,.45);max-height:300px;overflow:auto
  }
  .sugerencias-app .sug{
    display:flex;gap:10px;justify-content:space-between;align-items:center;
    padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer
  }
  .sugerencias-app .sug:last-child{border-bottom:0}
  .sugerencias-app .sug .nom{font-size:13px;font-weight:600;line-height:1.25}
  .sugerencias-app .sug .mar{font-size:11px;color:var(--muted);margin-top:2px}
  .sugerencias-app .sug .st{font-size:11px;font-weight:700;white-space:nowrap}
  .st.ok{color:var(--green)}
  .st.no{color:var(--red)}
</style>
</head>
<body>

<header>
  <img src="./icons/icon-192-v2.png" alt="">
  <div class="t">
    <b>King Quepoa</b>
    <small id="estado"><span class="punto"></span>cargando…</small>
  </div>
  <button class="icono" id="btn-sync" title="Actualizar">⟳</button>
</header>

<main id="app"></main>

<nav>
  <button data-v="stock" class="activo"><i>🧴</i><span>Stock</span></button>
  <button data-v="vender" class="oculto"><i>🛒</i><span>Vender</span></button>
  <button data-v="cobros" class="oculto"><i>💰</i><span>Cobros</span></button>
  <button data-v="numeros" class="oculto"><i>📊</i><span>Números</span></button>
  <button data-v="catalogo"><i>📋</i><span>Catálogo</span></button>
  <button data-v="ajustes" class="oculto"><i>⚙️</i><span>Ajustes</span></button>
</nav>

<div id="hoja-wrap"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   King Quepoa · app del celular
   Lee el catálogo de Google (público) y manda movimientos con
   la clave privada que se pega una sola vez en Ajustes.
   ============================================================ */

const API = 'https://script.google.com/macros/s/AKfycbxwgQj5KlOZh7evelU9FsjJdLVZZSYh8hn5N51lSsLD13vmoajNJJg09u93h5OKopev/exec';
const VERSION = '1.12.2';
const FOTOS = './fotos/';
const FOTOS_GRANDES = './fotos_grandes/';
const LS = { datos:'kq_datos_v1', token:'kq_token_v1', notas:'kq_notas_v1', cobros:'kq_cobros_v1', ventas:'kq_ventas_v1', abonos:'kq_abonos_v1', numeros:'kq_numeros_v1', costos:'kq_costos_v1' };

let datos = { inventario:[], config:{}, guardado:null };
let cobros = [];
let nums = null, numsError = '', numsFiltro = 'todas', cargandoNums = false;
let costos = null, costosError = '', cargandoCostos = false;
let vista = 'stock';
let filtro = { q:'', cat:'Todos', soloStock:false };
let notas = [];
let instalarEvento = null;

/* ---------------- utilidades ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
function money(n){
  const v = Math.round(num(n));
  return '₡' + v.toLocaleString('de-DE');
}
function usd(n){
  const v = num(n);
  return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function norm(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
function mil(n){ return Math.round(num(n)/1000)*1000; }

// Prima en colones. El porcentaje es interno: el celular recibe solo montos.
let _primasCache = { raw: null, mapa: {} };
function primasMapa(){
  const raw = String((datos.config || {}).prima_json || '');
  if(raw !== _primasCache.raw){
    let mapa = {};
    try { mapa = JSON.parse(raw) || {}; } catch(e){ mapa = {}; }
    _primasCache = { raw: raw, mapa: mapa };
  }
  return _primasCache.mapa;
}
function primaDe(p){
  const directo = num(p && p.prima_crc);
  if(directo > 0) return directo;
  const m = primasMapa()[p && p.id];
  if(m != null) return num(m);
  // Compatibilidad con catálogos viejos que todavía traen el porcentaje.
  const pct = num((datos.config || {}).prima_sugerida);
  return pct > 0 ? mil(num(p.precio_crc) * pct / 100) : 0;
}

// Costos de compra (privados: solo llegan con la clave).
let _costosCache = { raw: null, mapa: {} };
function costosMapa(){
  const raw = costos && costos.costos;
  if(raw !== _costosCache.raw){
    const mapa = {};
    (raw || []).forEach(c => { mapa[String(c.id)] = c; });
    _costosCache = { raw: raw, mapa: mapa };
  }
  return _costosCache.mapa;
}
function costoDe(p){
  if(!token()) return null;
  return (p && costosMapa()[String(p.id)]) || null;
}
function margenDe(p, costo){
  const precio = num(p && p.precio_crc);
  const costoCrc = num(costo && costo.costo_crc);
  const ganancia = precio - costoCrc;
  const margen = precio > 0 ? (ganancia / precio) * 100 : 0;
  return { ganancia: ganancia, margen: margen };
}

// Sin token = visitante: solo catálogo y precios.
function esDueno(){ return !!token(); }

function fotoUrl(p){
  const f = String((p && p.foto) || '');
  if(!f) return '';
  if(/^https?:\/\//i.test(f)) return f;
  return FOTOS + f.split('/').map(encodeURIComponent).join('/');
}

// Versión GRANDE de la foto (para la imagen que se manda por WhatsApp).
function fotoGrandeUrl(p){
  const f = String((p && p.foto) || '');
  if(!f) return '';
  if(/^https?:\/\//i.test(f)) return f;
  return FOTOS_GRANDES + f.split('/').map(encodeURIComponent).join('/');
}

function emojiFamilia(f){  const s = norm(f);
  if(/citric|hesperid|limon|naranja/.test(s)) return '🍋';
  if(/frut/.test(s)) return '🍓';
  if(/floral/.test(s)) return '🌸';
  if(/dulce|gourmand|vainilla|caramelo/.test(s)) return '🍯';
  if(/ambar|oriental/.test(s)) return '🔥';
  if(/especiad/.test(s)) return '🌶️';
  if(/amaderad|madera|woods/.test(s)) return '🪵';
  if(/acuatic|marin/.test(s)) return '💧';
  if(/aromatic|fouger/.test(s)) return '🌿';
  if(/cuero|leather/.test(s)) return '🧥';
  return '🧴';
}
function genero(cat){
  const c = String(cat||'');
  if(c === 'Hombre') return '👨 Fragancia de hombre';
  if(c === 'Mujer')  return '👩 Fragancia de mujer';
  if(c === 'Unisex') return '⚥ Perfume unisex';
  return '';
}
function hace(ts){
  if(!ts) return 'sin datos';
  const d = new Date(ts);
  if(isNaN(d)) return 'sin datos';
  const min = Math.floor((Date.now() - d.getTime())/60000);
  if(min < 1) return 'recién';
  if(min < 60) return 'hace ' + min + ' min';
  const h = Math.floor(min/60);
  if(h < 24) return 'hace ' + h + ' h';
  return 'hace ' + Math.floor(h/24) + ' d';
}
function toast(msg, tipo){
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast on' + (tipo === 'error' ? ' error' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.className = 'toast' + (tipo === 'error' ? ' error' : ''); }, 2600);
}

/* ---------------- almacenamiento ---------------- */
function leerLS(k, def){
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }
  catch(e){ return def; }
}
function guardarLS(k, v){
  try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){}
}

function token(){
  try { return localStorage.getItem(LS.token) || ''; } catch(e){ return ''; }
}
function guardarToken(t){
  try { t ? localStorage.setItem(LS.token, t) : localStorage.removeItem(LS.token); } catch(e){}
}
function abonosOn(){
  try { return (localStorage.getItem(LS.abonos) || '1') !== '0'; } catch(e){ return true; }
}
function guardarAbonosOn(v){
  try { localStorage.setItem(LS.abonos, v ? '1' : '0'); } catch(e){}
}

/* ---------------- roles: dueño vs visitante ---------------- */
function aplicarRol(){
  const dueno = esDueno();
  const privadas = ['vender','cobros','numeros','ajustes'];
  let visibles = 0;
  document.querySelectorAll('nav button').forEach(b => {
    const ocultar = !dueno && privadas.indexOf(b.dataset.v) !== -1;
    b.classList.toggle('oculto', ocultar);
    if(!ocultar) visibles++;
  });
  const nav = document.querySelector('nav');
  if(nav) nav.style.gridTemplateColumns = 'repeat(' + Math.max(visibles, 1) + ',minmax(0,1fr))';
  if(!dueno && privadas.indexOf(vista) !== -1) vista = 'stock';
}

// Acceso discreto para el dueño (visitantes no ven Cobros, Vender ni Ajustes).
function abrirAcceso(){
  const w = document.createElement('div');
  w.className = 'hoja-fondo';
  w.style.zIndex = 70;
  w.innerHTML = `<div class="hoja">
    <div class="agarre"></div>
    <h2>Acceso del dueño</h2>
    <div class="sub">Pegá la clave para ver cobros, ventas y ajustes. Queda guardada solo en este teléfono.</div>
    <label class="f"><span>Clave</span><input id="ac-clave" type="password" placeholder="Clave" autocomplete="new-password"></label>
    <div class="acciones">
      <button class="btn" id="ac-ok">Entrar</button>
      <button class="btn ghost" id="ac-cancel">Cancelar</button>
    </div>
  </div>`;
  document.body.appendChild(w);
  const cerrar = () => w.remove();
  w.querySelector('#ac-cancel').onclick = cerrar;
  w.querySelector('#ac-ok').onclick = async () => {
    const t = w.querySelector('#ac-clave').value.trim();
    if(!t) return toast('Pegá la clave', 'error');
    try {
      const r = await fetch(API + '?action=movimientos&token=' + encodeURIComponent(t) + '&limite=1&t=' + Date.now());

/* ---------------- WhatsApp / copiar ---------------- */
function telCR(tel){
  const d = String(tel||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.length === 8) return '506' + d;
  return d;
}
function abrirWhatsApp(texto, tel){
  const t = telCR(tel);
  const url = 'https://wa.me/' + (t || '') + '?text=' + encodeURIComponent(texto);
  window.open(url, '_blank');
}
async function copiar(txt, msg){
  try {
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(txt);
      toast(msg || 'Copiado');
      return;
    }
  } catch(e){}
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(msg || 'Copiado'); }
  catch(e){ toast('No se pudo copiar', 'error'); }
  ta.remove();
}

/* ---------------- vender desde el teléfono (solo dueño) ---------------- */
function isoFecha(y, m, d){
  const x = new Date(y, m, d, 12, 0, 0);
  return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0');
}
function proximaCuotaISO(){
  const d = new Date();
  const y = d.getFullYear(), m = d.getMonth(), dia = d.getDate();
  return dia < 16 ? isoFecha(y, m, 16) : isoFecha(y, m + 1, 1);
}
function planDe(tipo){
  return ({ pagos:2, pagos_sin_recargo:2, un_pago_abono:1, pagos3:3, pagos4:4, pagos5:5 })[tipo] || 0;
}
function recargoDe(tipo){
  const n = planDe(tipo);
  if(!n || tipo === 'pagos_sin_recargo' || tipo === 'un_pago_abono') return 0;
  const c = datos.config || {};
  const v = num(c['recargo_p' + n]);
  if(v > 0) return v;
  return n === 2 ? num(c.recargo_pagos) : 0;
}
function totalVenta(p, cant, tipo){
  return mil(num(p.precio_crc) * cant * (1 + recargoDe(tipo) / 100));
}
function ventasLocales(){
  const v = leerLS(LS.ventas, []);
  return Array.isArray(v) ? v : [];
}
function guardarVentasLocales(v){ guardarLS(LS.ventas, v.slice(0, 40)); }

// Fechas siguientes al estilo día 1 / 16, a partir de una fecha.
function cuotasProg(primera, n){
  const fechas = [primera];
  const cur = new Date(primera + 'T12:00:00');
  for(let i = 0; i < 370 && fechas.length < n; i++){
    cur.setDate(cur.getDate() + 1);
    const dia = cur.getDate();
    if(dia === 1 || dia === 16) fechas.push(isoFecha(cur.getFullYear(), cur.getMonth(), cur.getDate()));
  }
  return fechas.slice(0, n);
}
function progDefaultFechasCel(){
  const a = proximaCuotaISO();
  return cuotasProg(a, 2);
}
function fechaCortaCel(iso){
  const [y, m, d] = String(iso || '').split('-');
  return d && m ? d + '/' + m : String(iso || '');
}

  };

  const togglePrima = () => {

    const box = $('#v-prima-datos');
    if(!chk || !box) return;

      if(!$('#v-prima-fecha').value) $('#v-prima-fecha').value = proximaCuotaISO();
      const ab = $('#v-abono');
      if(ab){ ab.value = 0; ab.dataset.tocado = '1'; }
      ajustarPrimerAbono();
    }
    actualizar();
  };

  const mostrarSugProd = () => {
    const box = $('#v-prod-sug');
    if(!box) return;
    const q = norm($('#v-prod-buscar').value);
    if(!q){ box.classList.add('oculto'); box.innerHTML = ''; return; }
    const lista = datos.inventario
      .filter(p => {
        const nom = norm(p.nombre), mar = norm(p.marca);
        if(q.length === 1) return nom.startsWith(q) || mar.startsWith(q);
        return nom.includes(q) || mar.includes(q);
      })
      .sort((a,b) => {
        const an = norm(a.nombre), bn = norm(b.nombre);
        const ap = an.startsWith(q) ? 0 : 1, bp = bn.startsWith(q) ? 0 : 1;
        if(ap !== bp) return ap - bp;
        const as = num(a.stock) > 0 ? 0 : 1, bs = num(b.stock) > 0 ? 0 : 1;
        if(as !== bs) return as - bs;
        return an.localeCompare(bn);
      })
      .slice(0, 12);

      box.innerHTML = `<div class="sug"><div><div class="nom">Sin resultados</div><div class="mar">Probá con otra marca o nombre</div></div></div>`;

    const p = $p();
    const res = $('#v-resumen');
    if(!p){
      res.style.display = 'none';
      return;

    const tipo = $tipo();
    const planN = planDe(tipo);

    $('#v-plan').classList.toggle('oculto', !esPlan);

    const resto = Math.max(0, total - monto);
    const modo = $('#v-modo') ? $('#v-modo').value : 'inicial';
    const esPrimer = esPlan && puedePrimer && modo === 'primer_pago' && monto > 0;
    const nCuotas = !esPlan ? 0 : (esPrimer ? planN - 1 : planN);

      partes.push(`Aviso prima: ${money(primaAviso.monto)} el ${fechaCortaCel(primaAviso.fecha)}`);
      partes.push(`Saldo ${money(restoP)} en ${planN} abono${planN === 1 ? '' : 's'} de ${money(porPago)}`);
      partes.push(fechas.map(fechaCortaCel).join(' · '));
    } else if(esPlan){
      partes.push(`${esPrimer ? '1er pago' : 'Prima'}: ${money(monto)}`);
      if(nCuotas > 0) partes.push(`Saldo ${money(resto)} en ${nCuotas} pago${nCuotas === 1 ? '' : 's'} de ${money(cuota)}`);
      else partes.push('Queda pagada');

    else if(cant > st) partes.push(`<span style="color:var(--red)">⛔ Solo hay ${st} en stock</span>`);
    else partes.push(`<span style="color:var(--green)">✅ ${st} en stock</span>`);

    res.style.display = '';
    res.innerHTML = partes.join(' · ');
  };

  $('#v-prod-buscar').addEventListener('input', () => {
    $('#v-prod').value = '';
    mostrarSugProd();
    actualizar();

async function refrescarEstadoVentas(){
  const t = token();

  try {
    const r = await fetch(API + '?action=movimientos&estado=pendiente&limite=200&token=' + encodeURIComponent(t) + '&t=' + Date.now());
    const j = await r.json();
    if(!j || !j.ok) return;
    const pend = new Set((j.movimientos || []).map(m => String(m.id)));
    const lista = ventasLocales();
    let cambio = false;
    lista.forEach(v => {

  } catch(e){ /* sin señal: se queda como estaba */ }
}

/* ---------------- Imagen tipo "Info" (misma que la web) para WhatsApp ---------------- */
function envolverTexto(ctx, texto, ancho){
  const salida = [];
  for(const parrafo of String(texto || '').split('\n')){
    const palabras = parrafo.split(/\s+/).filter(Boolean);
    if(!palabras.length){ salida.push(''); continue; }
    let linea = '';
    for(const w of palabras){
      const prueba = linea ? linea + ' ' + w : w;
      if(ctx.measureText(prueba).width > ancho && linea){ salida.push(linea); linea = w; }
      else linea = prueba;
    }
    if(linea) salida.push(linea);
  }
  return salida;
}
function rrect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
async function cargarFotoGrande(p){
  const urls = [fotoGrandeUrl(p), fotoUrl(p)].filter(Boolean);
  for(const u of urls){
    try {
      const r = await fetch(u, { cache: 'force-cache' });
      if(!r.ok) continue;
      const b = await r.blob();
      if(!/^image\//.test(b.type)) continue;
      return await createImageBitmap(b);
    } catch(e){ /* probamos la siguiente */ }
  }
  return null;
}
// Arma la imagen blanca con la foto, el nombre, el género, los ML, el precio y "A pagos"
// (el mismo estilo que el botón "Info" de la app de la PC).
async function imagenInfo(p){
  const bmp = await cargarFotoGrande(p);
  if(!bmp) return null;
  const W = 1080, M = 60, maxLado = 980;
  const esc = Math.min(maxLado / bmp.width, maxLado / bmp.height, 1);
  const iw = Math.round(bmp.width * esc), ih = Math.round(bmp.height * esc);
  const anchoTexto = W - M * 2;

  const precio = money(num(p.precio_crc));
  const pagos = money(num(p.precio_pagos_crc));
  const desc = String(p.descripcion || '').trim();
  const genImg = String(p.categoria||'') === 'Hombre' ? 'Fragancia de hombre'
               : String(p.categoria||'') === 'Mujer'  ? 'Fragancia de mujer'
               : String(p.categoria||'') === 'Unisex' ? 'Perfume unisex' : '';
  const mlTxt = num(p.ml) ? num(p.ml) + ' ML' : '';
  const FUENTE = "'Segoe UI', Roboto, Arial, sans-serif";

  const cm = document.createElement('canvas'); cm.width = W; cm.height = 10;
  const mc = cm.getContext('2d');
  mc.font = 'bold 50px ' + FUENTE;
  const lNombre = envolverTexto(mc, p.nombre, anchoTexto);
  mc.font = 'bold 46px ' + FUENTE;
  const wMl = mlTxt ? Math.ceil(mc.measureText(mlTxt).width) + 64 : 0;
  mc.font = '30px ' + FUENTE;
  const lDesc = desc ? envolverTexto(mc, desc, anchoTexto) : [];

  const hNombre = lNombre.length * 60;
  const hGen = genImg ? 48 : 0;
  const hMl = mlTxt ? 88 : 0;
  const hPrecio = 92, hPagos = 52;
  const DESC_LH = 42, DESC_GAP = 16;
  const hDesc = lDesc.length ? 30 + lDesc.reduce((s, ln) => s + (ln ? DESC_LH : DESC_GAP), 0) : 0;
  const H = M + ih + 34 + hNombre + hGen + hMl + 24 + hPrecio + hPagos + hDesc + M;

  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(bmp, (W - iw) / 2, M, iw, ih);

  let y = M + ih + 34;
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#171a21'; ctx.font = 'bold 50px ' + FUENTE;
  for(const ln of lNombre){ ctx.fillText(ln, M, y); y += 60; }
  if(genImg){
    ctx.fillStyle = '#8a6b1e'; ctx.font = 'bold 36px ' + FUENTE;
    ctx.fillText(genImg, M, y); y += 48;
  }
  if(mlTxt){
    const bh = 74, by = y + 2;
    ctx.fillStyle = '#c9a24b';
    rrect(ctx, M, by, wMl, bh, 20); ctx.fill();
    ctx.fillStyle = '#171a21'; ctx.font = 'bold 46px ' + FUENTE;
    ctx.fillText(mlTxt, M + 32, by + 13);
    y = by + bh + 12;
  }
  y += 24;
  ctx.fillStyle = '#c9a24b'; ctx.font = 'bold 72px ' + FUENTE;
  ctx.fillText(precio, M, y); y += 92;
  ctx.fillStyle = '#1f7a48'; ctx.font = 'bold 34px ' + FUENTE;
  ctx.fillText('A pagos: ' + pagos, M, y); y += 52;
  if(lDesc.length){
    y += 30; ctx.fillStyle = '#333a45'; ctx.font = '30px ' + FUENTE;
    for(const ln of lDesc){
      if(!ln){ y += DESC_GAP; continue; }
      ctx.fillText(ln, M, y); y += DESC_LH;
    }
  }
  return await new Promise(r => cv.toBlob(r, 'image/png'));
}

// Entrega una imagen SIN link: portapapeles → guardar/mostrar. Devuelve true si la copió.
async function entregarImagen(blob, mensaje){
  if(navigator.clipboard && window.ClipboardItem && window.isSecureContext){
    try {
      await navigator.clipboard.write([ new ClipboardItem({ 'image/png': blob }) ]);
      toast(mensaje || '🖼 Imagen copiada — pegala en WhatsApp');
      return true;
    } catch(e){ /* el teléfono no deja copiar imágenes: la guardamos */ }
  }
  guardarImagenEnTelefono(blob);
  return false;
}

// Guarda la imagen en el teléfono (o la muestra para guardarla a mano). Nunca manda el link.
function guardarImagenEnTelefono(blob){
  const esIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  if(esIOS){ mostrarImagenParaGuardar(blob); return; }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'king-quepoa-perfume.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast('🖼 Imagen guardada — mandala como foto en WhatsApp');
  } catch(e){
    mostrarImagenParaGuardar(blob);
  }
}

/* ---------------- factura de cobro (igual a la de la PC) ---------------- */
const MESES_LARGOS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS_LARGOS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function fmtFechaLarga(s){
  const v = String(s || '').slice(0, 10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return '—';
  const [y, m, d] = v.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return `${DIAS_LARGOS[dt.getDay()]} ${String(d).padStart(2,'0')}-${MESES_LARGOS[m-1]}-${y}`;
}
function fmtFechaCorta(s){
  const v = String(s || '').slice(0, 10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) return '—';
  return v.split('-').reverse().join('/');
}
function hoyISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function primerNombreDe(nombre){
  return String(nombre || '').trim().split(/\s+/)[0] || '';
}

// Plan de pagos de una venta: la PC lo manda en la columna "cuotas" de COBROS.
const _cuotasCache = new WeakMap();
function cuotasDe(v){
  if(v && typeof v === 'object' && _cuotasCache.has(v)) return _cuotasCache.get(v);
  let arr = [];
  const raw = v && v.cuotas;
  if(Array.isArray(raw)) arr = raw;
  else if(typeof raw === 'string' && raw.trim()){
    try { const j = JSON.parse(raw); if(Array.isArray(j)) arr = j; } catch(e){ /* formato viejo */ }
  }
  const out = arr.map((x, i) => ({
    numero: num(x.n || x.numero) || (i + 1),
    monto: num(x.m != null ? x.m : x.monto),
    vencimiento: String(x.f || x.vencimiento || '').slice(0, 10),
    pagada: !!(x.p != null ? num(x.p) : x.pagada),
    tipo: String(x.t || x.tipo || 'abono')
  }));
  if(v && typeof v === 'object') _cuotasCache.set(v, out);
  return out;
}
// Misma etiqueta que usa la PC: Aviso de prima / Abono 1 / Último abono.
function etiquetaCuota(v, cuotas, i){
  const c = cuotas[i];
  if(!c) return '';
  const total = cuotas.length;
  const tienePrima = cuotas.some(x => x && x.tipo === 'prima');
  if(c.tipo === 'prima') return 'Aviso de prima';
  if(String(v && v.tipo_pago) === 'programado' || tienePrima){
    if(total && i === total - 1) return 'Último abono';
    let n = 0;
    for(let j = 0; j <= i; j++) if(cuotas[j] && cuotas[j].tipo !== 'prima') n++;
    return 'Abono ' + Math.max(1, n);
  }
  return (total && i === total - 1) ? 'Último pago' : 'Pago ' + (i + 1);
}
// Plan "de respaldo" cuando el Apps Script todavía no manda las cuotas:
// usa el próximo vencimiento y el monto que ya venían en COBROS.
function planDeVenta(v){
  const arr = cuotasDe(v);
  if(arr.length) return { arr: arr, completo: true };
  const n = Math.max(num(v && v.pendientes), 1);
  const saldo = num(v && v.saldo);
  const prox = num(v && v.proximo_monto) > 0 ? num(v.proximo_monto) : Math.round(saldo / n);
  return {
    arr: [{ numero: 1, monto: prox, vencimiento: String((v && v.proximo) || '').slice(0,10), pagada: false, tipo: 'abono' }],
    completo: false
  };
}
// La foto del perfume: la que manda la PC o, si no, la del catálogo que ya tiene la app.
function claveProd(s){
  return norm(s).replace(/[^a-z0-9]/g, '');
}
function productoDeCobro(v){
  const id = String((v && v.producto_id) || '');
  if(id){
    const porId = datos.inventario.find(x => String(x.id) === id);
    if(porId) return porId;
  }
  const n = claveProd(v && v.producto);
  if(!n) return null;
  let p = datos.inventario.find(x => claveProd(x.nombre) === n);
  if(!p) p = datos.inventario.find(x => {
    const k = claveProd(x.nombre);
    return k.includes(n) || n.includes(k);
  });
  return p || null;
}
function fotoDeCobro(v){
  const p = productoDeCobro(v);
  const foto = String((v && v.foto) || (p && p.foto) || '');
  return foto ? { foto: foto } : null;
}
async function cargarBitmap(url){
  try {
    const r = await fetch(url, { cache: 'force-cache' });
    if(!r.ok) return null;
    const b = await r.blob();
    if(!/^image\//.test(b.type)) return null;
    return await createImageBitmap(b);
  } catch(e){ return null; }
}
// Toca una fila de Cobros: el ticket sale con TODAS las ventas pendientes del cliente,
// con foto y con el plan de pagos completo, igual que el botón 📲 de la PC.
function clienteDeCobro(c){
  const nombre = String((c && c.cliente) || '').trim();
  const tel = String((c && c.telefono) || '').replace(/\D/g,'');
  let ventas = cobros.filter(x => nombre
    ? norm(x.cliente) === norm(nombre)
    : (tel && String(x.telefono || '').replace(/\D/g,'') === tel));
  if(!ventas.length) ventas = [c];
  ventas = ventas.slice().sort((a,b) => String(a.fecha_venta || '').localeCompare(String(b.fecha_venta || '')));
  return { nombre: nombre, tel: tel, ventas: ventas };
}

// Recordatorio de pago como IMAGEN, con el MISMO formato que la factura de la PC:
// logo + foto del perfume, título, cliente, próxima cuota, plan completo y datos de SINPE.
async function imagenCobro(cli){
  const cfg = datos.config || {};
  const pago = String(cfg.datos_pago || '').trim();
  const hoyStr = hoyISO();
  const pend = (cli.ventas || []).filter(v => num(v.saldo) > 0.5);
  let prox = null, proxV = null, proxIdx = -1;
  for(const v of pend){
    const arr = planDeVenta(v).arr;
    const i = arr.findIndex(x => !x.pagada);
    if(i >= 0 && (!prox || arr[i].vencimiento < prox.vencimiento)){ prox = arr[i]; proxV = v; proxIdx = i; }
  }
  const planProx = proxV ? planDeVenta(proxV) : null;
  const totCuotas = planProx && planProx.completo ? planProx.arr.length : 0;
  const tienePrima = !!(planProx && planProx.arr.some(x => x.tipo === 'prima'));
  const titulo = prox
    ? (prox.tipo === 'prima' ? 'AVISO DE PRIMA'
       : tienePrima ? etiquetaCuota(proxV, planProx.arr, proxIdx).toUpperCase()
       : (planProx && planProx.completo
          ? (prox.numero === totCuotas ? 'RECORDATORIO DE ÚLTIMO PAGO' : 'RECORDATORIO DE PAGO ' + prox.numero + ' DE ' + totCuotas)
          : 'RECORDATORIO DE PAGO'))
    : 'RECORDATORIO DE PAGO';

  const W = 1080, M = 80, cx = W / 2;
  const FUENTE = "'Segoe UI', Roboto, Arial, sans-serif";
  const cv = document.createElement('canvas'); cv.width = W; cv.height = 6000;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, cv.height);
  ctx.textBaseline = 'top'; ctx.textAlign = 'center';
  let y = 40;

  function linea(){
    ctx.strokeStyle = '#e6d6a8'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(M, y); ctx.lineTo(W - M, y); ctx.stroke(); y += 34;
  }
  function texto(t, font, color, lh){
    ctx.font = font; ctx.fillStyle = color;
    for(const ln of envolverTexto(ctx, t, W - M * 2)){ ctx.fillText(ln, cx, y); y += lh; }
  }

  // Arriba: LOGO + FOTO del perfume (con el nombre chico)
  const primV = pend[0];
  const lado = 200, gap = 80;
  const logo = await cargarBitmap('./logo.png');
  const fotoP = primV ? fotoDeCobro(primV) : null;
  const foto = fotoP ? await cargarFotoGrande(fotoP) : null;
  const ancho = lado * 2 + gap, x1 = cx - ancho / 2, x2 = x1 + lado + gap;
  if(logo) ctx.drawImage(logo, x1, y, lado, lado);
  if(foto){
    const esc = Math.min(lado / foto.width, lado / foto.height);
    const fw = foto.width * esc, fh = foto.height * esc;
    ctx.drawImage(foto, x2 + (lado - fw) / 2, y + (lado - fh) / 2, fw, fh);
  }
  y += lado + 12;
  if(primV){
    const prod = productoDeCobro(primV);
    const nombreFoto = String((prod && prod.nombre) || primV.producto || '') + ' x' + num(primV.cantidad || 1);
    ctx.fillStyle = '#5b5f66'; ctx.font = '22px ' + FUENTE;
    let yn = y;
    for(const ln of envolverTexto(ctx, nombreFoto, lado + 120)){ ctx.fillText(ln, x2 + lado / 2, yn); yn += 28; }
    y = yn;
  }
  y += 18;
  linea();

  texto(titulo, 'bold 38px ' + FUENTE, '#171a21', 50);
  y += 10;
  ctx.textAlign = 'left'; ctx.fillStyle = '#171a21'; ctx.font = '28px ' + FUENTE;
  ctx.fillText('Cliente: ' + (cli.nombre || ''), M, y);
  ctx.textAlign = 'right'; ctx.fillStyle = '#8a8f99'; ctx.font = '24px ' + FUENTE;
  ctx.fillText(fmtFechaLarga(hoyISO()), W - M, y + 3);
  ctx.textAlign = 'center';
  y += 54;

  for(const v of pend){
    const plan = planDeVenta(v);
    const arr = plan.arr;
    const cu = arr.filter(x => !x.pagada);
    const cuota = cu[0];

    // Recuadro con la FECHA + monto, y al lado el saldo pendiente
    const boxW = 560, boxH = 176, bx = M + boxW / 2;
    ctx.fillStyle = '#fbf4df'; ctx.fillRect(M, y, boxW, boxH);
    ctx.strokeStyle = '#ecd9a8'; ctx.lineWidth = 3; ctx.strokeRect(M, y, boxW, boxH);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#8a6b1e'; ctx.font = 'bold 24px ' + FUENTE;
    // "TU PRÓXIMO PAGO" si todavía no vence; "TU PAGO DE HOY" si vence hoy; "VENCIDO" si ya pasó.
    const baseCaja = cuota && cuota.tipo === 'prima' ? 'PRIMA' : (tienePrima ? 'ABONO' : 'PAGO');
    let etiquetaCaja = 'TU ' + baseCaja;
    if(cuota && cuota.vencimiento){
      if(cuota.vencimiento === hoyStr) etiquetaCaja = 'TU ' + baseCaja + ' DE HOY';
      else if(cuota.vencimiento > hoyStr) etiquetaCaja = (baseCaja === 'PRIMA' ? 'TU PRIMA' : 'TU PRÓXIMO ' + baseCaja);
      else etiquetaCaja = 'TU ' + baseCaja + ' VENCIDO';
    }
    ctx.fillText(etiquetaCaja, bx, y + 20);
    if(cuota){
      ctx.fillStyle = '#171a21'; ctx.font = 'bold 34px ' + FUENTE;
      ctx.fillText(fmtFechaLarga(cuota.vencimiento), bx, y + 56);
      ctx.fillStyle = '#1f7a48'; ctx.font = 'bold 50px ' + FUENTE;
      ctx.fillText(money(cuota.monto), bx, y + 104);
    } else {
      ctx.fillStyle = '#c0392b'; ctx.font = 'bold 48px ' + FUENTE;
      ctx.fillText(money(num(v.saldo)), bx, y + 80);
    }
    const rx = M + boxW + 44;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#8a8f99'; ctx.font = '24px ' + FUENTE;
    ctx.fillText('Saldo pendiente:', rx, y + 48);
    ctx.fillStyle = '#c0392b'; ctx.font = 'bold 42px ' + FUENTE;
    ctx.fillText(money(num(v.saldo)), rx, y + 84);
    // Abonado: el monto va en dorado; "de total" en gris.
    const tAntes = 'Abonado ', tMonto = money(num(v.abonado)), tDespues = ' de ' + money(num(v.total));
    ctx.font = '22px ' + FUENTE;
    const wAntes = ctx.measureText(tAntes).width;
    ctx.font = 'bold 22px ' + FUENTE;
    const wMonto = ctx.measureText(tMonto).width;
    ctx.fillStyle = '#8a8f99'; ctx.font = '22px ' + FUENTE;
    ctx.fillText(tAntes, rx, y + 136);
    ctx.fillStyle = '#c9a24b'; ctx.font = 'bold 22px ' + FUENTE;
    ctx.fillText(tMonto, rx + wAntes, y + 136);
    ctx.fillStyle = '#8a8f99'; ctx.font = '22px ' + FUENTE;
    ctx.fillText(tDespues, rx + wAntes + wMonto, y + 136);
    ctx.textAlign = 'center';
    y += boxH + 26;

    // Los pagos que siguen, para que el ticket muestre el plan completo
    const siguientes = cu.slice(1);
    if(siguientes.length){
      ctx.textAlign = 'left';
      let yl = y;
      for(const x of siguientes){
        const et = etiquetaCuota(v, arr, arr.indexOf(x));
        ctx.fillStyle = x.tipo === 'prima' ? '#8a6b1e' : '#333a45';
        ctx.font = (x.tipo === 'prima' ? 'bold ' : '') + '22px ' + FUENTE;
        ctx.fillText(et + ':', M, yl);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#5b5f66';
        ctx.fillText(fmtFechaCorta(x.vencimiento) + ' · ' + money(x.monto), W - M, yl);
        ctx.textAlign = 'left';
        yl += 30;
      }
      y = yl + 6;
      ctx.textAlign = 'center';
    }
  }

  linea();

  // Datos para pagar
  if(pago){
    ctx.textAlign = 'center';
    ctx.fillStyle = '#c9a24b'; ctx.font = 'bold 22px ' + FUENTE;
    ctx.fillText('Datos para pagar (SINPE):', cx, y); y += 30;
    ctx.fillStyle = '#333a45'; ctx.font = '22px ' + FUENTE;
    for(const ln of pago.split('\n')){ ctx.fillText(ln, cx, y); y += 28; }
    y += 10;
  }

  // Pie
  texto('¡Gracias por comprar en King Quepoa, tu esencia, tu estilo, tu reino!', '24px ' + FUENTE, '#8a6b1e', 36);

  const H = Math.ceil(y) + 40;
  const final = document.createElement('canvas'); final.width = W; final.height = H;
  final.getContext('2d').drawImage(cv, 0, 0, W, H, 0, 0, W, H);
  return await new Promise(r => final.toBlob(r, 'image/png'));
}

}

async function cargarCostos(mostrar){
  const t = token();
  if(!t) return;

/* ---------------- cobros (clientes que deben) ---------------- */
let cobrosError = '';

function textoCobro(c){
  const cli = (c && c.ventas) ? c : { nombre: (c && c.cliente) || '', ventas: c ? [c] : [] };
  const cfg = datos.config || {};
  const pago = String(cfg.datos_pago || '').trim();
  const pend = (cli.ventas || []).filter(v => num(v.saldo) > 0.5);
  const bloques = [];
  for(const v of pend){
    const plan = planDeVenta(v);
    const arr = plan.arr;
    const cu = arr.filter(x => !x.pagada);
    const prod = `📦 *${v.producto || 'tu perfume'}*${num(v.cantidad) > 1 ? ' ×' + num(v.cantidad) : ''}`;
    if(cu.length){
      const lineas = cu.map(x => {
        const et = plan.completo ? etiquetaCuota(v, arr, arr.indexOf(x)).toLowerCase() : 'próximo pago';
        return `• *${et}* — ${fmtFechaLarga(x.vencimiento)}: *${money(x.monto)}*`;
      });
      const extra = plan.completo ? '' : `\nSaldo pendiente: *${money(v.saldo)}*`;
      bloques.push(`${prod}\n${lineas.join('\n')}${extra}`);
    } else {
      bloques.push(`${prod}\nSaldo pendiente: *${money(v.saldo)}*`);
    }
  }
  const total = pend.reduce((s, v) => s + num(v.saldo), 0);
  let t = `¡Hola ${primerNombreDe(cli.nombre)}! ¿Cómo estás? 👋\n`;
  t += `Te escribimos de *King Quepoa Perfumería* 🧴\n\n`;
  t += bloques.length ? bloques.join('\n\n') : `Tenés un saldo de *${money(total)}*.`;
  t += `\n\n💳 Podés hacer el pago por *SINPE Móvil*`;
  if(pago) t += `:\n${pago}`;
  t += `\n\n¡Gracias por comprar en King Quepoa, tu esencia, tu estilo, tu reino! ✨`;
  return t;
}

async function cargarCobros(mostrar){
  const t = token();
  if(!t){ if(mostrar) toast('Falta la clave en Ajustes', 'error'); return; }
  if(mostrar) toast('Actualizando…');
  try {
    const r = await fetch(API + '?action=cobros&token=' + encodeURIComponent(t) + '&t=' + Date.now());
    const j = await r.json();
    if(!j || !j.ok) throw new Error((j && j.error) || 'No se pudo leer la lista');
    cobros = Array.isArray(j.cobros) ? j.cobros : [];
    cobrosError = '';
    guardarLS(LS.cobros, { cobros, guardado: Date.now() });
    if(vista === 'cobros') render();
    if(mostrar) toast('Cobros actualizados');
  } catch(e) {
    cobrosError = /desconocida/i.test(e.message)
      ? 'Falta actualizar el script de Google (versión 1.1).'
      : e.message;
    if(vista === 'cobros') render();
    if(mostrar) toast(cobrosError, 'error');
  }
}

    app.innerHTML = `<div class="card">
      <h3>Clientes que deben</h3>
      <p class="hint" style="margin:8px 0 14px">Los saldos son privados: necesitan la clave. Se pone una sola vez.</p>
      <button class="btn" id="cb-ir">Ir a Ajustes</button>
    </div>`;
    $('#cb-ir').onclick = () => { vista = 'ajustes'; render(); };
    return;
  }

  if(!cobros.length){
    if(cobrosError){
      app.innerHTML = `<div class="card">
        <h3>Clientes que deben</h3>
        <p class="hint" style="margin:8px 0 14px">${esc(cobrosError)}</p>
        <button class="btn ghost" id="cb-ref">⟳ Reintentar</button>
      </div>`;
      $('#cb-ref').onclick = () => cargarCobros(true);
      return;
    }
    app.innerHTML = `<div class="vacio"><span class="em">✅</span>No hay clientes con saldo pendiente.
      <div style="font-size:12.5px;margin-top:6px">Si acabás de cobrar, actualizá la lista.</div></div>
      <button class="btn ghost" id="cb-ref">⟳ Actualizar</button>`;
    $('#cb-ref').onclick = () => cargarCobros(true);
    return;
  }

  const total = cobros.reduce((s,c) => s + num(c.saldo), 0);
  const atras = cobros.filter(c => num(c.atrasado) === 1).length;

  app.innerHTML = `
    <div class="card" style="display:flex;gap:10px;align-items:center">
      <div style="flex:1">
        <small class="muted" style="font-size:11px;letter-spacing:.08em">TOTAL POR COBRAR</small>
        <div style="font-size:23px;font-weight:700;color:var(--gold2);line-height:1.2">${money(total)}</div>
      </div>
      <div style="text-align:right">
        <small class="muted" style="font-size:11px;letter-spacing:.08em">CLIENTES</small>
        <div style="font-size:23px;font-weight:700;line-height:1.2">${cobros.length}</div>
      </div>
    </div>
    ${atras ? `<div class="aviso">⚠️ ${atras} con abono vencido. Tocalo para mandarle el recordatorio.</div>` : ''}
    ${cobrosError ? `<div class="aviso">${esc(cobrosError)}</div>` : ''}
    <div class="buscador"><span>🔍</span><input id="cb-q" placeholder="Buscar cliente o perfume…" autocomplete="off"></div>
    <div id="cb-confirmacion" class="aviso ok" style="display:none"></div>
    <div id="cb-lista"></div>`;

  const pintar = () => {
    const q = norm($('#cb-q').value);
    const lista = cobros.filter(c =>
      !q || norm(c.cliente).includes(q) || norm(c.producto).includes(q));
    const cont = $('#cb-lista');
    if(!lista.length){
      cont.innerHTML = `<div class="vacio"><span class="em">🔍</span>No encontré ese cliente.</div>`;
      return;
    }
    cont.innerHTML = lista.map(c => {
      const atrasado = num(c.atrasado) === 1;
      const fecha = c.proximo ? String(c.proximo).slice(0,10).split('-').reverse().join('/') : '';
      const cant = num(c.cantidad) > 1 ? ' · ' + num(c.cantidad) + ' u.' : '';
      return `<div class="prod" data-cobro="${esc(c.venta_id)}">
        <div class="foto" style="font-size:20px">💰</div>
        <div class="info">
          <div class="nom" style="color:${atrasado ? 'var(--red)' : 'var(--green)'}">${esc(c.cliente)}</div>
          <div class="mar">${esc(c.producto || '')}${cant}</div>
          <div class="fila">
            <span class="precio">${money(c.saldo)}</span>
            <span class="pagos">${fecha ? (atrasado ? 'venció ' : 'vence ') + fecha : ''}</span>
          </div>
          <div class="fila" style="margin-top:4px">
            <span class="tag">Abonado ${money(c.abonado)} de ${money(c.total)}</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;align-items:center;align-self:center">
          ${abonosOn() ? `<span data-abonar="${esc(c.venta_id)}" style="font-size:20px;color:var(--gold2);cursor:pointer" title="Registrar abono">💵</span>` : ''}

        </div>
      </div>`;

    cont.querySelectorAll('[data-abonar]').forEach(el => {
      el.addEventListener('click', ev => {
        ev.stopPropagation();
        const c = cobros.find(x => String(x.venta_id) === String(el.dataset.abonar));
        if(c) abrirAbono(c);

    cont.querySelectorAll('[data-cobro]').forEach(el => {

    const x = $('#cb-confirmacion'); if(x) x.style.display = 'none';

function abrirAbono(c){
  if(!c) return;
  const saldo = num(c.saldo);
  const pend = Math.max(num(c.pendientes), 1);
  const sugerido = num(c.proximo_monto) > 0 ? num(c.proximo_monto) : Math.round(saldo / pend);
  const hoy = new Date();
  const fechaHoy = isoFecha(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
  const wrap = $('#hoja-wrap');
  wrap.innerHTML = `<div class="hoja-fondo">
    <div class="hoja">
      <div class="agarre"></div>
      <h2>Registrar abono</h2>
      <div class="sub">${esc(c.cliente)} · ${esc(c.producto || '')}</div>
      <div class="aviso" style="margin:12px 0">Saldo pendiente: <b>${money(saldo)}</b></div>
      <label class="f"><span>Monto del abono ₡</span><input id="ab-monto" type="number" min="1" step="100" value="${sugerido}" inputmode="numeric"></label>
      <label class="f"><span>Fecha</span><input id="ab-fecha" type="date" value="${fechaHoy}"></label>
      <div id="ab-resumen" class="hint"></div>
      <div style="display:grid;gap:8px;margin-top:10px">
        <button class="btn" id="ab-guardar">Registrar abono</button>
        <button class="btn ghost" id="ab-cancelar">Cancelar</button>
      </div>
    </div>
  </div>`;
  const cerrar = () => { wrap.innerHTML = ''; };
  const act = () => {
    const m = Math.min(num($('#ab-monto').value), saldo);
    $('#ab-resumen').textContent = m > 0 ? `Quedaría un saldo de ${money(Math.max(0, saldo - m))}` : '';
  };
  $('#ab-monto').addEventListener('input', act);
  act();
  $('#ab-cancelar').onclick = cerrar;
  $('.hoja-fondo').addEventListener('click', e => { if(e.target.classList.contains('hoja-fondo')) cerrar(); });
  $('#ab-guardar').onclick = async () => {
    const t = token();
    if(!t) return toast('Falta la clave en Acceso', 'error');
    const monto = Math.min(num($('#ab-monto').value), saldo);
    if(!(monto > 0)) return toast('Escribí el monto del abono', 'error');
    const fecha = $('#ab-fecha').value || fechaHoy;
    const btn = $('#ab-guardar');
    btn.disabled = true; btn.textContent = 'Registrando…';
    try {
      const marca = '[[KQV:' + JSON.stringify({ venta_id: Number(c.venta_id) }) + ']]';
      const r = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'movimiento', token: t, tipo: 'abono',
          cliente: c.cliente || '', telefono: c.telefono || '', monto: monto,
          fecha: fecha, nota: 'Abono desde el celular ' + marca,
          dispositivo: 'app-celular'
        })
      });
      const j = await r.json();
      if(!j || !j.ok) throw new Error((j && j.error) || 'Google rechazó el abono');
      cerrar();
      mostrarConfirmacionCobro(`✅ Abono de ${money(monto)} anotado · ${c.cliente}`);
      setTimeout(() => { if(vista === 'cobros') cargarCobros(false); }, 62000);
    } catch(e){
      toast(e.message || 'No se pudo registrar', 'error');
      btn.disabled = false; btn.textContent = 'Registrar abono';
    }
  };
}

/* ---------------- Mis números (privado: con clave) ---------------- */
async function cargarNumeros(mostrar){

  if(!t){ if(mostrar) toast('Falta la clave en Acceso', 'error'); return; }
  if(cargandoNums) return;
  cargandoNums = true;
  if(mostrar) toast('Actualizando…');
  try {
    const r = await fetch(API + '?action=numeros&token=' + encodeURIComponent(t) + '&t=' + Date.now());
    const j = await r.json();
    if(!j || !j.ok) throw new Error((j && j.error) || 'No se pudo leer Mis números');
    nums = j.numeros || null;
    numsError = '';
    guardarLS(LS.numeros, { nums: nums, guardado: Date.now() });
    if(vista === 'numeros') render();
    if(mostrar) toast('Números actualizados');
  } catch(e) {
    numsError = /desconocida/i.test(e.message)
      ? 'Falta actualizar el script de Google (versión 1.5).'
      : (e.message || 'Sin señal');
    if(vista === 'numeros') render();
    if(mostrar) toast(numsError, 'error');
  } finally {
    cargandoNums = false;
  }
}

// Sticker de agradecimiento (mismo diseño que la PC)
async function imagenGraciasCel(v){
  let logo = await cargarBitmap('./logo-gracias.png');
  if(!logo) logo = await cargarBitmap('./logo.png');
  if(!logo) return null;
  const W = 2000;
  const logoH = Math.round(W * logo.height / logo.width);
  const nombre = primerNombreDe(v.cliente).toUpperCase();
  const producto = (String(v.perfume || '') + (num(v.cantidad) > 1 ? ' × ' + num(v.cantidad) : '')).trim();
  const saludo = nombre ? `¡GRACIAS, ${nombre}!` : '¡GRACIAS POR TU COMPRA!';

  const cv = document.createElement('canvas');
  const ctx = cv.getContext('2d');
  cv.width = W; cv.height = 10;
  const maxTxt = W - 180;
  ctx.font = "bold 80px Georgia, 'Times New Roman', serif";
  const lSaludo = envolverTexto(ctx, saludo, maxTxt).slice(0, 2);
  ctx.font = "bold 54px 'Segoe UI', Arial, sans-serif";
  const lProd = producto ? envolverTexto(ctx, producto, maxTxt).slice(0, 2) : [];

  const H = logoH + 70 + lSaludo.length * 96 + (producto ? 60 + lProd.length * 68 : 0) + 70;
  cv.height = H;
  ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(logo, 0, 0, W, logoH);

  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  let y = logoH + 70;
  ctx.fillStyle = '#c9a24b'; ctx.font = "bold 80px Georgia, 'Times New Roman', serif";
  for(const ln of lSaludo){ ctx.fillText(ln, W / 2, y); y += 96; }
  if(producto){
    ctx.fillStyle = '#98a0af'; ctx.font = "46px 'Segoe UI', Arial, sans-serif";
    ctx.fillText('por tu compra de', W / 2, y); y += 60;
    ctx.fillStyle = '#e8eaf0'; ctx.font = "bold 54px 'Segoe UI', Arial, sans-serif";
    for(const ln of lProd){ ctx.fillText(ln, W / 2, y); y += 68; }
  }
  return await new Promise(r => cv.toBlob(r, 'image/png'));
}

async function enviarGraciasCel(v){
  const tel = String(v.telefono || '').replace(/\D/g, '');

  await entregarImagen(blob, '🙏 Agradecimiento listo — pegalo en el chat');

async function subirNotaAuto(n){
  if(!n || n.subida) return true;
  const t = token();
  if(!t){ n.error = 'Falta la clave'; return false; }
  try {
    const r = await fetch(API, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ action:'aviso', token:t, texto:n.texto, fecha:new Date(n.ts).toISOString(), dispositivo:'app-celular' })
    });
    const j = await r.json();
    if(j && j.ok){ n.subida = true; n.idRemoto = j.id; n.error = ''; guardarNotas(); return true; }
    n.error = (j && j.error) || 'Google rechazó la nota';
  } catch(e){
    n.error = e.message || 'Sin señal';
  }
  guardarNotas();
  return false;
}

async function subirNotasPendientes(silencioso){
  if(!token()) return;
  const pend = notas.filter(n => !n.subida);
  if(!pend.length) return;
  let ok = 0;
  for(const n of pend){
    if(await subirNotaAuto(n)) ok++;
    else break;
  }
  guardarNotas();
  if(vista === 'notas') pintarListaNotas();
  if(ok) toast(`☁️ ${ok} nota${ok===1?'':'s'} subida${ok===1?'':'s'} a la PC`);
  else if(!silencioso) toast('No se pudo subir: ' + mensajeGoogle(pend[0] && pend[0].error), 'error');
}

function mensajeGoogle(e){
  const m = String((e && e.message) || e || '');
  if(/desconocida/i.test(m)) return 'Falta actualizar el script de Google (versión 1.2).';
  return m;
}

function numeroNegocio(){
  const n = String((datos.config && datos.config.wa_numero) || '').replace(/\D/g,'');
  return n || '50664431076';
}

function enviarNotaWhatsApp(n){
  if(!n) return;

  const txt = `📝 Recordatorio · King Quepoa\n\n${n.texto}\n\n${f}`;

async function borrarNota(i){
  const n = notas[i];
  if(!n) return;
  const donde = n.subida ? 'del teléfono y de Google' : 'del teléfono';
  if(!confirm(`¿Borrar esta nota ${donde}?`)) return;

  if(n.subida && n.idRemoto){
    const t = token();
    if(!t) return toast('Falta la clave en Ajustes', 'error');
    try {
      const r = await fetch(API, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ action:'borrar', token:t, ids:[n.idRemoto] })
      });
      const j = await r.json();
      if(!j || !j.ok) throw new Error((j && j.error) || 'No se pudo borrar en Google');
    } catch(e){
      toast('No se borró en Google: ' + mensajeGoogle(e), 'error');
      return;
    }
  }

  notas.splice(i, 1);
  guardarNotas();
  render();
  toast('Nota borrada');
}

        <button class="btn ghost" id="a-actualizar">⟳ Actualizar inventario</button>
        <button class="btn ghost" id="a-instarar" ${instalarEvento?'':'hidden'}>📲 Instalar en el teléfono</button>
        <p class="hint" id="a-instalar-tip" style="margin-top:2px"></p>
        <button class="btn rojo" id="a-limpiar">Borrar datos guardados</button>
      </div>
    </div>

    <div class="card">
      <h3>Vender y cobrar</h3>
      <label class="f"><span style="display:flex;align-items:center;gap:8px;text-transform:none;font-size:13px"><input type="checkbox" id="a-abonos" style="width:auto"> Permitir abonos desde el teléfono</span></label>
      <p class="hint">Si lo apagás, en Cobros solo se pueden mandar recordatorios.</p>
    </div>

    <div class="card">
      <h3>Pedir un perfume</h3>
      <p class="hint" style="margin-bottom:10px">Llega a la PC como pedido. Ahí lo revisás y lo cargás al inventario.</p>
      <label class="f"><span>Perfume</span><input id="p-nombre" placeholder="Ej: Eros Flame" autocomplete="off"></label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <label class="f"><span>Marca</span><input id="p-marca" placeholder="Versace" autocomplete="off"></label>
        <label class="f"><span>ml</span><input id="p-ml" type="number" min="1" inputmode="numeric"></label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <label class="f"><span>Género</span><select id="p-cat">
          <option value="">Elegí...</option><option>Hombre</option><option>Mujer</option><option>Unisex</option>
        </select></label>
        <label class="f"><span>Concentración</span><select id="p-conc">
          <option value="">Elegí...</option><option>EDT</option><option>EDP</option><option>Parfum</option>
          <option>Elixir</option><option>Extrait</option><option value="__no__">No aplica</option>
        </select></label>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <label class="f"><span>Costo USD</span><input id="p-usd" type="number" step="0.01" inputmode="decimal"></label>
        <label class="f"><span>Cantidad</span><input id="p-cant" type="number" min="1" value="1" inputmode="numeric"></label>
      </div>
      <button class="btn" id="p-enviar">Enviar pedido a la PC</button>
    </div>

    <div class="card">
      <h3>Cómo funciona</h3>
      <p class="hint">
        Esta app <b>muestra el catálogo</b> y, con la clave, <b>registra ventas</b>. Las ventas entran solas al sistema en menos de un minuto (si la PC está encendida).<br><br>
        La PC publica sola los cambios, y esta app los ve al abrir o al tocar ⟳.<br><br>
        Sin clave, la app es solo para mirar: no muestra cobros, ventas ni ajustes.
      </p>
    </div>

    <p class="hint" style="text-align:center;padding:8px 0 4px">Versión ${VERSION}</p>`;

  $('#a-token').value = token();
  const esIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const tip = $('#a-instalar-tip');
  if(tip){
    tip.textContent = instalarEvento
      ? 'Tocá el botón y confirmá. Queda como una app más.'
      : (esIOS
          ? 'En iPhone: tocá Compartir (⬆️) abajo y elegí "Agregar a pantalla de inicio".'
          : 'En Chrome: menú ⋮ (arriba a la derecha) → "Instalar aplicación" o "Agregar a pantalla principal".');
  }
  $('#a-datos').textContent = datos.guardado
    ? (datos.inventario.length + ' perfumes · actualizado ' + hace(datos.guardado))
    : 'Sin datos guardados todavía.';

  const chkAbonos = $('#a-abonos');
  if(chkAbonos){
    chkAbonos.checked = abonosOn();
    chkAbonos.onchange = e => {
      guardarAbonosOn(e.target.checked);
      toast(e.target.checked ? '✅ Abonos desde el teléfono activados' : 'Abonos desde el teléfono desactivados');
    };
  }

  $('#p-enviar').onclick = async () => {
    const t = token();
    if(!t) return toast('Falta la clave en Acceso', 'error');
    const nombre = $('#p-nombre').value.trim();
    if(!nombre) return toast('Escribí el nombre del perfume', 'error');
    const pd = {
      marca: $('#p-marca').value.trim(),
      categoria: $('#p-cat').value,
      concentracion: $('#p-conc').value === '__no__' ? '' : $('#p-conc').value,
      ml: Math.round(num($('#p-ml').value)) || 0,
      costo_usd: num($('#p-usd').value) || 0,
      cantidad: Math.max(1, Math.round(num($('#p-cant').value) || 1))
    };
    const marca = '[[KQV:' + JSON.stringify(Object.assign({ pedido: true }, pd)) + ']]';
    const btn = $('#p-enviar');
    btn.disabled = true; btn.textContent = 'Enviando…';
    try {
      const r = await fetch(API, {
        method:'POST',
        headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action:'movimiento', token:t, tipo:'pedido',
          perfume: nombre, cantidad: pd.cantidad,
          nota: 'Pedido desde el celular ' + marca,
          dispositivo:'app-celular'
        })
      });
      const j = await r.json();
      if(!j || !j.ok) throw new Error((j && j.error) || 'Google rechazó el pedido');
      toast('📦 Pedido enviado: revisalo en la PC');
      ['p-nombre','p-marca','p-ml','p-usd'].forEach(id => $('#'+id).value = '');
      $('#p-cat').value = ''; $('#p-conc').value = ''; $('#p-cant').value = 1;
    } catch(e){
      toast(e.message || 'No se pudo enviar', 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Enviar pedido a la PC';
    }
  };

  $('#a-guardar').onclick = () => {
    const t = $('#a-token').value.trim();
    guardarToken(t);
    aplicarRol();
    toast(t ? 'Clave guardada' : 'Clave borrada');
    render();
    if(t){ cargarCobros(false); cargarCostos(false); }
  };

  $('#a-probar').onclick = async () => {
    const t = $('#a-token').value.trim();
    if(!t) return toast('Pegá la clave primero', 'error');
    guardarToken(t);
    aplicarRol();
    render();
    toast('Probando…');
    try {
      const r = await fetch(API + '?action=movimientos&token=' + encodeURIComponent(t) + '&limite=1&t=' + Date.now());
      const j = await r.json();
      if(j && j.ok) toast('✅ Conexión correcta');
      else toast((j && j.error) || 'La clave no funciona', 'error');
    } catch(e){ toast('Sin conexión', 'error'); }
  };

  $('#a-actualizar').onclick = () => sincronizar(false);

  $('#a-instarar').onclick = async () => {
    if(!instalarEvento) return;
    instalarEvento.prompt();
    await instalarEvento.userChoice;
    instalarEvento = null;
    render();
  };

  $('#a-limpiar').onclick = () => {
    if(!confirm('Borra el catálogo y los registros guardados en este teléfono. No borra nada en Google.')) return;
    try {
      localStorage.removeItem(LS.datos);
      localStorage.removeItem(LS.notas);
      localStorage.removeItem(LS.cobros);
      localStorage.removeItem(LS.numeros);
      localStorage.removeItem(LS.costos);
    } catch(e){}
    datos = { inventario:[], config:{}, guardado:null };
    notas = [];
    cobros = [];
    nums = null;
    costos = null;
    toast('Datos borrados');
    sincronizar(false);
    render();
  };
}

/* ---------------- navegación ---------------- */
document.querySelectorAll('nav button').forEach(b => {
  b.addEventListener('click', () => {
    vista = b.dataset.v;
    try { history.replaceState(null, '', '#' + vista); } catch(e){}
    render();
    if(vista === 'cobros') cargarCobros(false);
    if(vista === 'numeros') cargarNumeros(false);
    window.scrollTo(0,0);
  });
});
$('#btn-sync').addEventListener('click', () => {
  sincronizar(false);
  if(token()) cargarCostos(false);
  if(vista === 'numeros') cargarNumeros(false);
});

window.addEventListener('online', () => { pintarEstado(); });
window.addEventListener('offline', () => pintarEstado(true));
window.addEventListener('hashchange', () => {
  const h = location.hash.replace('#','');
  if(['stock','vender','cobros','numeros','catalogo','ajustes'].includes(h) && h !== vista){
    vista = h;
    render();
    if(h === 'cobros') cargarCobros(false);
    if(h === 'numeros') cargarNumeros(false);
    window.scrollTo(0,0);
  }
});
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  instalarEvento = e;
  if(vista === 'ajustes') render();
});

document.addEventListener('click', ev => {
  const box = document.querySelector('#v-prod-sug');
  if(box && !box.contains(ev.target) && ev.target.id !== 'v-prod-buscar') box.classList.add('oculto');
});

/* ---------------- arranque ---------------- */
(function init(){
  const guardado = leerLS(LS.datos, null);
  if(guardado && Array.isArray(guardado.inventario)){
    datos = guardado;
  }
  notas = leerLS(LS.notas, []);
  if(!Array.isArray(notas)) notas = [];

  const gc = leerLS(LS.cobros, null);
  if(gc && Array.isArray(gc.cobros)) cobros = gc.cobros;

  const gn = leerLS(LS.numeros, null);
  if(gn && gn.nums) nums = gn.nums;

  const gco = leerLS(LS.costos, null);
  if(gco && Array.isArray(gco.costos)) costos = gco;

  // Permite cargar la clave una sola vez desde un enlace:  ...?clave=XXXX
  try {
    const params = new URLSearchParams(location.search);
    const claveUrl = params.get('clave');
    if(claveUrl && claveUrl.trim()){
      guardarToken(claveUrl.trim());
      params.delete('clave');
      const q = params.toString();
      history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash);
      setTimeout(() => toast('Clave guardada en este teléfono'), 600);
    }
  } catch(e){}

  const h = location.hash.replace('#','');
  if(['stock','vender','cobros','numeros','catalogo','ajustes'].includes(h)) vista = h;

  render();
  pintarEstado(!navigator.onLine);

  sincronizar(true).then(() => {
    if(token()) cargarCobros(false);
    if(token()) cargarCostos(false);
    if(token() && vista === 'numeros') cargarNumeros(false);
  });

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
